<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHTN 6 — Kiểm tra trắc nghiệm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap');

  :root{
    --ink:#1c2b2a;
    --paper:#f6f2e9;
    --paper-2:#efe8d8;
    --line:#d8cfb8;
    --moss:#2f5d50;
    --moss-dark:#1e4038;
    --clay:#c5622d;
    --clay-soft:#f0d9c8;
    --gold:#c99a2e;
    --ok:#2f7a4f;
    --ok-bg:#e3f0e4;
    --bad:#b23a2e;
    --bad-bg:#fbe6e1;
    --shadow: 0 1px 0 rgba(28,43,42,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Be Vietnam Pro', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .bg-texture{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(47,93,80,.06), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(197,98,45,.07), transparent 45%);
  }
  #app{position:relative; z-index:1; max-width:920px; margin:0 auto; padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  .site-head{
    display:flex; align-items:baseline; justify-content:space-between;
    padding-bottom:18px; margin-bottom:28px;
    border-bottom:2px solid var(--ink);
  }
  .site-head .mark{
    font-family:'Fraunces', serif; font-weight:700; font-size:26px; letter-spacing:-.01em;
    display:flex; align-items:baseline; gap:10px; cursor:pointer;
  }
  .site-head .mark small{
    font-family:'Be Vietnam Pro', sans-serif; font-weight:600; font-size:12.5px;
    color:var(--moss); letter-spacing:.02em;
  }
  .site-head .tagline{ font-size:13px; color:#6b6255; max-width:220px; text-align:right; line-height:1.4;}

  /* ---------- Breadcrumb ---------- */
  .crumbs{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:13.5px; color:#7a7061; margin-bottom:22px;
  }
  .crumbs button{
    background:none;border:none;padding:0;font:inherit;color:#7a7061;cursor:pointer;
    text-decoration:underline; text-decoration-color:transparent; transition:text-decoration-color .15s;
  }
  .crumbs button:hover{ text-decoration-color:#7a7061; }
  .crumbs .current{ color:var(--ink); font-weight:600; }
  .crumbs .sep{ color:#c9bfa9; }

  /* ---------- Chapter grid (home) ---------- */
  .home-lead{ margin-bottom:26px; }
  .home-lead h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:clamp(28px,4vw,38px);
    line-height:1.15; margin:0 0 8px; letter-spacing:-.01em;
  }
  .home-lead p{ margin:0; color:#5c5346; font-size:15px; max-width:56ch; line-height:1.55;}

  .chapter-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;
  }
  .chapter-card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:3px;
    padding:20px 20px 18px; cursor:pointer; text-align:left;
    display:flex; flex-direction:column; gap:10px; position:relative;
    transition:transform .12s ease, border-color .12s ease;
  }
  .chapter-card:hover{ border-color:var(--moss); transform:translateY(-2px); }
  .chapter-card .num{
    font-family:'Fraunces', serif; font-size:13px; color:var(--clay); font-weight:600;
    letter-spacing:.03em;
  }
  .chapter-card h3{
    margin:0; font-family:'Fraunces', serif; font-weight:600; font-size:18.5px; line-height:1.3;
  }
  .chapter-card .meta{ font-size:12.5px; color:#847a6a; margin-top:auto; padding-top:6px; }

  /* ---------- Test list (chapter view) ---------- */
  .chapter-hero{ margin-bottom:24px; }
  .chapter-hero .num{ font-family:'Fraunces', serif; color:var(--clay); font-weight:600; font-size:14px;}
  .chapter-hero h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:clamp(26px,4vw,34px); margin:4px 0 6px;
  }
  .chapter-hero p{ color:#5c5346; font-size:14.5px; margin:0; }

  .test-list{ display:flex; flex-direction:column; gap:10px; }
  .test-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:var(--paper-2); border:1px solid var(--line); border-radius:3px;
    padding:16px 20px; cursor:pointer; transition:border-color .12s ease, transform .12s ease;
  }
  .test-row:hover{ border-color:var(--moss); transform:translateX(2px); }
  .test-row .left{ display:flex; align-items:center; gap:14px; }
  .test-row .badge{
    width:38px; height:38px; border-radius:50%; background:var(--moss); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif;
    font-weight:700; font-size:15px; flex-shrink:0;
  }
  .test-row .label{ font-weight:600; font-size:15.5px; }
  .test-row .sub{ font-size:12.5px; color:#847a6a; margin-top:2px; }
  .test-row .go{ color:var(--clay); font-size:20px; }
  .test-row.done .badge{ background:var(--ok); }
  .test-row .score-pill{
    font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px;
    background:var(--ok-bg); color:var(--ok); white-space:nowrap;
  }
  .test-row .score-pill.low{ background:var(--bad-bg); color:var(--bad); }

  .mode-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .mode-tab{
    font:inherit; font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:20px;
    border:1.5px solid var(--line); background:var(--paper-2); color:#7a7061; cursor:pointer;
    transition:all .12s ease;
  }
  .mode-tab.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .mode-tab:not(.active):hover{ border-color:var(--moss); color:var(--moss); }
  .mode-note{ font-size:13px; color:#96897a; font-style:italic; margin:-8px 0 18px; }

  /* ---------- Quiz ---------- */
  .quiz-top{ margin-bottom:20px; }
  .quiz-top h1{ font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin:2px 0 14px;}
  .progress-track{
    height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin-bottom:10px;
  }
  .progress-fill{ height:100%; background:var(--moss); transition:width .25s ease; }
  .dots{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .dot{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper-2);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#8a8071;
    cursor:pointer;
  }
  .dot.current{ border-color:var(--moss); color:var(--moss); box-shadow:0 0 0 2px rgba(47,93,80,.15); }
  .dot.answered.correct{ background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }
  .dot.answered.wrong{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad); }

  .q-card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:4px; padding:34px 34px 30px;
  }
  .q-index{ font-family:'Fraunces', serif; color:var(--clay); font-weight:700; font-size:20px; margin-bottom:16px;}
  .q-text{ font-size:30px; line-height:1.5; margin:0 0 30px; font-weight:600; }
  .options{ display:flex; flex-direction:column; gap:16px; }
  .opt{
    display:flex; align-items:flex-start; gap:18px; text-align:left;
    background:var(--paper); border:2px solid var(--line); border-radius:4px;
    padding:20px 22px; cursor:pointer; font:inherit; font-size:23px; line-height:1.5; color:var(--ink);
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(:disabled){ border-color:var(--moss); }
  .opt .letter{
    flex-shrink:0; width:38px; height:38px; border-radius:50%; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; color:#8a8071;
  }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:var(--ok-bg); border-color:var(--ok); }
  .opt.correct .letter{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .opt.wrong{ background:var(--bad-bg); border-color:var(--bad); }
  .opt.wrong .letter{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .opt.dim{ opacity:.55; }

  .feedback{
    margin-top:22px; padding:18px 20px; border-radius:4px; font-size:22px; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .feedback.ok{ background:var(--ok-bg); color:var(--ok); }
  .feedback.bad{ background:var(--bad-bg); color:var(--bad); }

  .quiz-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
  .btn{
    font:inherit; font-weight:600; font-size:19px; padding:15px 28px; border-radius:4px; cursor:pointer;
    border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); transition:opacity .12s ease;
  }
  .btn.secondary{ background:transparent; color:var(--ink); }
  .btn:hover{ opacity:.85; }
  .btn:disabled{ opacity:.35; cursor:default; }

  /* ---------- Result screen ---------- */
  .result-hero{ text-align:center; padding:38px 20px 30px; }
  .result-hero .score-big{
    font-family:'Fraunces', serif; font-weight:700; font-size:64px; line-height:1; color:var(--moss);
  }
  .result-hero .score-of{ font-size:16px; color:#6b6255; margin-top:6px;}
  .result-hero .verdict{ font-size:15.5px; margin-top:14px; color:#4a4438; max-width:40ch; margin-left:auto; margin-right:auto;}
  .result-actions{ display:flex; gap:10px; justify-content:center; margin-top:24px; flex-wrap:wrap;}

  .review-list{ display:flex; flex-direction:column; gap:12px; margin-top:30px; }
  .review-item{
    border:1px solid var(--line); border-radius:3px; padding:16px 18px; background:var(--paper-2);
  }
  .review-item .q-text{ font-size:14.5px; margin-bottom:10px; }
  .review-item .row{ font-size:13.5px; padding:4px 0; display:flex; gap:8px;}
  .review-item .row .tag{ font-weight:700; flex-shrink:0; }
  .review-item .row.you .tag{ color:var(--bad); }
  .review-item .row.correct .tag{ color:var(--ok); }
  .review-title{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; margin:0 0 4px; }

  footer.note{ text-align:center; font-size:12px; color:#a89d89; margin-top:50px; }

  @media (max-width:560px){
    .q-card{ padding:20px 18px; }
    .site-head .tagline{ display:none; }
  }
</style>
</head>
<body>
<div class="bg-texture"></div>
<div id="app"></div>

<script>
const QUIZ_DATA = [{"name": "Chương I. Mở đầu về Khoa học tự nhiên", "tests": [{"name": "Bài 1", "questions": [{"q": "Hoạt động nào sau đây không phải là hoạt động nghiên cứu khoa học tự nhiên?", "opts": ["Làm thí nghiệm tìm hiểu tính chất của chất.", "Lấy mẫu nước bẩn để nghiên cứu và tìm cách xử lí nước bẩn.", "Thả diều trên đê.", "Nghiên cứu và sản xuất điện gió."], "ans": "C"}, {"q": "Khoa học tự nhiên có vai trò vô cùng quan trọng. Hoạt động nào sau đây không có vai trò của khoa học tự nhiên?", "opts": ["Hoạt động nghiên cứu khoa học để tìm ra quy luật của chúng.", "Nâng cao nhận thức của con người về thế giới tự nhiên.", "Ứng dụng thành tựu khoa học vào cuộc sống.", "Mê tín, dị đoan."], "ans": "D"}, {"q": "Vật nào sau đây là vật không sống?", "opts": ["Con trâu.", "Vi khuẩn.", "Núi đá vôi.", "Cây dừa."], "ans": "C"}, {"q": "Nhận xét nào sau đây không đúng?", "opts": ["Đến độ tuổi nhất định hoặc do thiên tai, bệnh tật,... vật sống sẽ bị chết và khi đó trở thành vật không sống.", "Một chú robot có thể cười, nói và hành động như một con người, nó là vật sống.", "Vật sống là vật có các đặc điểm sống như: trao đổi chất và chuyển hoá năng lượng, sinh trưởng, phát triển, vận động, cảm ứng, sinh sản.", "Vật không sống là vật không có đặc điểm của vật sống."], "ans": "B"}, {"q": "Thước nào dưới đây thích hợp nhất để đo độ dài sân trường?", "opts": ["Thước thẳng có GHĐ 1 m và ĐCNN 1 mm.", "Thước cuộn có GHĐ 5 m và ĐCNN 5 mm.", "Thước dây có GHĐ 150 cm và ĐCNN 1 mm.", "Thước thẳng có GHĐ 1 m và ĐCNN 1 cm."], "ans": "B"}, {"q": "Để cân 1 kg muối, dùng cân nào dưới đây là phù hợp?", "opts": ["Cân có ĐCNN 1 g và GHĐ 1 kg.", "Cân có ĐCNN 100 g và GHĐ 10 kg.", "Cân có ĐCNN 10 g và GHĐ 10 kg.", "Cân có ĐCNN 1 kg và GHĐ 100 kg."], "ans": "C"}, {"q": "Một chiếc cân có GHĐ 5 kg và ĐCNN 10 g. Mỗi phép cân có thể sai số", "opts": ["100 g.", "1 g.", "10 g.", "1,01 g."], "ans": "C"}, {"q": "Khi đo thời gian môn chạy cự li 200 m của vận động viên, trọng tài sẽ đo khoảng thời gian", "opts": ["từ lúc vận động viên lấy đà chạy tới lúc về đích.", "từ lúc có lệnh xuất phát tới lúc về đích.", "vận động viên chạy 50 m rồi nhân bốn.", "vận động viên chạy 100 m rồi nhân hai."], "ans": "B"}, {"q": "Giới hạn đo của nhiệt kế", "opts": ["là chỉ số lớn nhất ghi trên nhiệt kế.", "là chỉ số nhỏ nhất ghi trên nhiệt kế.", "là khoảng cách giữa hai vạch chia trên nhiệt kế.", "là như nhau đối với tất cả các loại nhiệt kế."], "ans": "A"}, {"q": "Bạn An đo chiều cao của bạn Dũng bằng thước cuộn có GHĐ 2 m và ĐCNN 0,5 cm. Kết quả đo của An lần lượt là: 148 cm; 148,5 cm; 148,63 cm; 149 cm. Chiều cao của bạn Dũng là", "opts": ["149,0 cm.", "148,63 cm.", "148,5 cm", "148,0 cm."], "ans": "B"}]}, {"name": "Bài 2", "questions": [{"q": "Lĩnh vực nào sau đây không phải của khoa học tự nhiên?", "opts": ["Vật lí học.", "Hoá học.", "Sinh học.", "Văn học"], "ans": "D"}, {"q": "Nhận xét nào sau đây không đúng?", "opts": ["Nghiên cứu vắc-xin phòng chống virus Corona trong phòng thí nghiệm là một hoạt động nghiên cứu khoa học.", "Điện gió là năng lượng sạch. Sử dụng điện gió góp phần bảo vệ môi trường.", "Sử dụng thuốc trừ sâu hoá học trong sản xuất nông nghiệp không gây hại cho sức khoẻ con người và động vật.", "Phân bón hoá học góp phần tăng năng suất trong sản xuất nông nghiệp. Tuy nhiên sử dụng phân bón không hợp lí cũng có thể gây ô nhiễm môi trường, ảnh hưởng tới sức khoẻ con người."], "ans": "C"}, {"q": "Vật nào sau đây là vật sống?", "opts": ["Cây cầu.", "Xe đạp.", "Cái bàn.", "Con gà."], "ans": "D"}, {"q": "Đặc điểm nào sau đây của kính lúp và kính hiển vi giống nhau?", "opts": ["Dùng để nhìn rõ các vật thể nhỏ.", "Dùng để quan sát các vật mà mắt thường không thể nhìn thấy được.", "Dùng để quan sát các vật có kích thước lớn.", "Dùng để đọc sách."], "ans": "B"}, {"q": "Khi đo chiều dài của một vật, chọn thước nào sau đây giúp ta đo chính xác hơn?", "opts": ["Thước có GHĐ lớn hơn chiều dài cần đo và ĐCNN thích hợp.", "Thước có GHĐ nhỏ hơn chiều dài cần đo và ĐCNN thích hợp.", "Thước có GHĐ bằng chiều dài cần đo, không quan tâm tới ĐCNN.", "Thước có GHĐ và ĐCNN tuỳ ý."], "ans": "A"}, {"q": "Chọn đơn vị đo thích hợp cho mỗi chỗ trống: a) Khối lượng của một học sinh lớp 6 là … b) Khối lượng của chiếc xe tải là … c) Khối lượng của viên thuốc cảm là …", "opts": ["45 kg; 2,4 tạ; 2 kg.", "45 yến; 2,4 tấn; 2 g.", "45 kg; 2,4 tấn; 2 g.", "45 kg; 2,4 tạ; 2 g."], "ans": "D"}, {"q": "Trước khi đo thời gian của một hoạt động ta thường ước lượng khoảng thời gian của hoạt động đó để làm gì?", "opts": ["Lựa chọn đồng hồ đo phù hợp.", "Đặt mắt đúng cách.", "Hiệu chỉnh đồng hồ đúng cách.", "Đọc kết quả đo chính xác."], "ans": "A"}, {"q": "Tàu SE 5 xuất phát từ ga Hà Nội lúc 15:45 ngày 30/4/2022 đến ga Đà Nẵng lúc 09:12 ngày 1/5/2022. Thời gian tàu chạy giữa hai địa điểm trên là", "opts": ["1 ngày 9 giờ 12 phút.", "17 giờ 27 phút.", "1 ngày 17 giờ 27 phút.", "17 giờ 33 phút."], "ans": "C"}, {"q": "Chất lỏng nào sau đây không được dùng để chế tạo nhiệt kế?", "opts": ["Thuỷ ngân.", "Rượu.", "Dầu.", "Nước."], "ans": "D"}, {"q": "Xác định GHĐ và ĐCNN của nhiệt kế chuyên dụng để làm bánh (thang đo 0-400°C, vạch chia mỗi 5°C).", "opts": ["GHĐ 400 °C; ĐCNN 10 °C.", "GHĐ 400 °C; ĐCNN 20 °C.", "GHĐ 400 °C; ĐCNN 5 °C.", "GHĐ 400 °C; ĐCNN 1 °C."], "ans": "C"}]}], "lessons": [{"name": "Bài 1. Giới thiệu về Khoa học tự nhiên", "questions": [{"q": "Vật dụng nào sau đây cần đến điện năng?", "opts": ["Đèn điện.", "Cái bàn gỗ.", "Bếp gas.", "Bút mực."], "ans": "A"}, {"q": "Trước đây, người ta liên lạc với nhau bằng thư viết tay. Ngày nay, con người liên lạc, kết nối với nhau nhanh hơn nhờ phương tiện nào sau đây?", "opts": ["Ti vi.", "Smartphone (điện thoại thông minh).", "Ô tô.", "Máy bay."], "ans": "B"}, {"q": "Khi đưa hai cực cùng tên của hai nam châm lại gần nhau thì có hiện tượng gì xảy ra?", "opts": ["Hai nam châm hút nhau.", "Hai nam châm đẩy nhau.", "Hai nam châm đẩy nhau rồi hút nhau.", "Không có hiện tượng gì xảy ra."], "ans": "B"}, {"q": "Khi đun nóng đường kính trắng, hiện tượng quan sát được là:", "opts": ["Đường trắng bay hơi thành đường ở thể khí.", "Đường trắng chuyển màu thành màu vàng rồi màu đen.", "Đường trắng nóng chảy, sau đó chuyển thành màu vàng rồi cuối cùng thành màu đen.", "Đường trắng chuyển ngay thành màu đen."], "ans": "C"}, {"q": "Khi nhúng chiếc bút chì vào cốc nước thì quan sát được hiện tượng nào sau đây?", "opts": ["Chiếc bút chì tan vào nước.", "Chiếc bút chì như bị gãy ở mặt nước.", "Chiếc bút chì bốc cháy.", "Chiếc bút chì bị gãy thành hai đoạn."], "ans": "B"}, {"q": "Lĩnh vực nào sau đây không phải của Khoa học tự nhiên?", "opts": ["Hoá học.", "Vật lí học.", "Sinh học.", "Lịch sử học."], "ans": "D"}, {"q": "Hành động nào sau đây gây ảnh hưởng không tốt tới môi trường tự nhiên?", "opts": ["Tái chế rác thải.", "Đốt than để tạo ra điện (nhiệt điện).", "Sử dụng ánh sáng mặt trời tạo ra điện.", "Trồng, chăm sóc và bảo vệ cây xanh."], "ans": "B"}, {"q": "Điện thoại thông minh (Smartphone) là một phát minh tuyệt vời của con người. Tuy nhiên, mục đích sử dụng nào sau đây là không đúng khi sử dụng điện thoại thông minh?", "opts": ["Sử dụng cho mục đích học tập.", "Sử dụng để liên lạc cho người thân khi cần thiết.", "Sử dụng để chơi trò chơi suốt ngày đêm.", "Sử dụng để giải trí ở mức độ phù hợp với lứa tuổi."], "ans": "C"}, {"q": "Hành động nào sau đây giúp bảo vệ môi trường sống của chúng ta?", "opts": ["Để nhà cửa, phòng học bẩn, không dọn dẹp.", "Xả rác bừa bãi.", "Thải khí thải, nước thải không qua xử lí vào môi trường.", "Sử dụng năng lượng sạch như năng lượng gió, năng lượng mặt trời, năng lượng sóng biển."], "ans": "D"}, {"q": "Nhận xét nào sau đây đúng?", "opts": ["Khoa học tự nhiên là một nhánh của khoa học, nghiên cứu các hiện tượng tự nhiên, tìm ra tính chất, các quy luật của chúng.", "Khoa học tự nhiên gồm rất nhiều lĩnh vực: Sinh học; Hoá học; Vật lí học; Khoa học Trái Đất và Thiên văn học; Lịch sử học.", "Khoa học tự nhiên gồm rất nhiều lĩnh vực: Sinh học; Hoá học; Vật lí học; Khoa học Trái Đất và Thiên văn học; Dân tộc học.", "Sử dụng nhiên liệu hoá thạch như xăng, dầu, than đá,... không ảnh hưởng tới môi trường mà còn giúp thúc đẩy phát triển giao thông của con người."], "ans": "A"}]}, {"name": "Bài 2. An toàn trong phòng thực hành", "questions": [{"q": "Điều nào sau đây không được làm trong phòng thí nghiệm?", "opts": ["Cặp, túi, ba lô phải để đúng quy định. Có đầy đủ các dụng cụ bảo hộ như kính bảo vệ mắt, găng tay lấy hoá chất, khẩu trang thí nghiệm, quần áo bảo hộ thích hợp,... khi làm thí nghiệm, thực hành.", "Chỉ làm thí nghiệm, các bài thực hành khi có sự hướng dẫn và giám sát của giáo viên.", "Thực hiện đúng nguyên tắc khi sử dụng hoá chất, dụng cụ, thiết bị phòng thực hành để đảm bảo an toàn tuyệt đối khi làm thí nghiệm.", "Ăn uống, làm mất trật tự trong phòng thực hành."], "ans": "D"}, {"q": "Tại sao phải đeo kính bảo vệ mắt và sử dụng quần áo bảo hộ, găng tay khi làm thí nghiệm với hoá chất?", "opts": ["Để đúng tác phong khi vào phòng thí nghiệm.", "Để bảo đảm an toàn khi tiến hành thí nghiệm.", "Để dễ thực hiện các thao tác thí nghiệm.", "Để dễ lấy hoá chất."], "ans": "B"}, {"q": "Quy tắc an toàn trong phòng thực hành không có nội dung nào dưới đây?", "opts": ["Mặc trang phục gọn gàng, nữ buộc tóc cao, đeo găng tay, khẩu trang, bảo vệ mắt và thiết bị bảo vệ khác (nếu cần).", "Không ăn uống, đùa nghịch trong phòng thí nghiệm; không nếm hoặc ngửi hoá chất.", "Sau khi làm xong thí nghiệm, thu gom chất thải để đúng nơi quy định, lau dọn sạch sẽ chỗ làm việc; sắp xếp dụng cụ gọn gàng, đúng chỗ; rửa sạch tay bằng xà phòng.", "Tiến hành thí nghiệm khi có người làm cùng."], "ans": "D"}, {"q": "Khi gặp sự cố mất an toàn trong phòng thực hành, em cần thực hiện hành động nào sau đây?", "opts": ["Tiếp tục làm thí nghiệm.", "Báo cáo ngay với giáo viên trong phòng thực hành.", "Tự xử lí và không báo cáo với giáo viên.", "Nhờ bạn bè xung quanh xử lí sự cố."], "ans": "B"}]}, {"name": "Bài 3. Sử dụng kính lúp", "questions": [{"q": "Muốn nhìn rõ dấu vân tay thì em phải dùng dụng cụ nào dưới đây?", "opts": ["Kính lúp.", "Kính hiển vi.", "Kính thiên văn.", "Kính cận thị."], "ans": "A"}, {"q": "Kính lúp thường có khả năng phóng to vật từ", "opts": ["3 đến 10 lần.", "3 đến 20 lần.", "5 đến 10 lần.", "5 đến 20 lần."], "ans": "B"}, {"q": "Kính lúp cầm tay đơn giản thì phần rìa …(1)… phần giữa, thường được bảo vệ bởi …(2)… và có …(3)… (1), (2), (3) lần lượt là:", "opts": ["mỏng hơn, một khung, tay cầm.", "tay cầm, một khung, mỏng hơn.", "mỏng hơn, tay cầm, một khung.", "một khung, mỏng hơn, tay cầm."], "ans": "A"}, {"q": "Cách sử dụng kính lúp nào sau đây đúng?", "opts": ["Đặt kính lúp xa mẫu vật, mắt nhìn vào mặt kính, từ từ dịch vật lại gần cho đến khi nhìn thấy vật rõ nét.", "Đặt kính lúp gần sát mẫu vật, mắt nhìn vào mặt kính, từ từ dịch kính lại gần vật cho đến khi nhìn thấy vật rõ nét.", "Đặt kính lúp gần sát mẫu vật, mắt nhìn vào mặt kính, từ từ dịch kính ra xa vật cho đến khi nhìn thấy vật rõ nét.", "Đặt kính lúp gần sát mẫu vật, mắt nhìn vào mặt kính."], "ans": "C"}, {"q": "Không nên bảo quản kính lúp theo cách sau:", "opts": ["Lau chùi, vệ sinh kính thường xuyên bằng khăn mềm.", "Sử dụng nước sạch hoặc nước rửa kính lúp chuyên dụng (nếu có).", "Không để mặt kính lúp tiếp xúc với vật nhám, bẩn.", "Không cần lau chùi, vệ sinh mà khi dùng xong chỉ cần cất vào hộp."], "ans": "D"}, {"q": "Người ta thường sử dụng kính lúp để quan sát các vật có kích thước", "opts": ["nhỏ.", "lớn.", "vô cùng nhỏ.", "vô cùng lớn."], "ans": "A"}]}, {"name": "Bài 4. Sử dụng kính hiển vi quang học", "questions": [{"q": "Muốn quan sát tế bào của lá cây thì em phải dùng dụng cụ nào dưới đây?", "opts": ["Kính lúp.", "Kính hiển vi quang học.", "Kính thiên văn.", "Kính cận thị."], "ans": "B"}, {"q": "Kính hiển vi quang học thường có khả năng phóng to ảnh của vật từ", "opts": ["10 đến 100 lần.", "40 đến 1000 lần.", "30 đến 3000 lần.", "40 đến 3000 lần."], "ans": "D"}, {"q": "Mẫu vật có thể dùng kính hiển vi quang học để quan sát là", "opts": ["kiến, ruồi.", "giun, sán dây.", "tép cam, tép bưởi.", "tế bào động vật, thực vật."], "ans": "D"}, {"q": "Không nên bảo quản kính hiển vi quang học theo cách nào sau đây?", "opts": ["Dùng nước rửa bát vệ sinh kính hiển vi khi dùng xong và cất vào hộp.", "Khi cầm kính hiển vi một tay cầm vào thân kính, tay kia đỡ chân đế của kính. Phải để kính trên bề mặt phẳng.", "Không để tay bẩn hay ướt lên kính hiển vi.", "Lau thị kính và vật kính bằng giấy chuyên dụng trước và sau khi dùng."], "ans": "A"}, {"q": "Bước 1 khi sử dụng kính hiển vi quang học là:", "opts": ["Điều chỉnh ánh sáng.", "Đặt tiêu bản lên bàn kính.", "Vặn ốc nhỏ thật chậm.", "Chọn vật kính thích hợp."], "ans": "D"}, {"q": "Bước 5 khi sử dụng kính hiển vi quang học là:", "opts": ["Điều chỉnh ánh sáng.", "Đặt tiêu bản lên bàn kính.", "Vặn ốc nhỏ thật chậm đến khi nhìn thấy mẫu vật thật rõ nét.", "Chọn vật kính thích hợp."], "ans": "C"}]}, {"name": "Bài 5. Đo chiều dài", "questions": [{"q": "Đơn vị cơ bản đo độ dài trong hệ đơn vị đo lường hợp pháp của nước Việt Nam là", "opts": ["mét (m).", "inch (in).", "kilômét (km).", "dặm (mile)."], "ans": "A"}, {"q": "Đơn vị thường dùng để xác định độ cao đế giầy/dép là", "opts": ["dm.", "cm.", "m.", "inch."], "ans": "B"}, {"q": "Các quả bóng rổ có kích thước khác nhau đã bị mờ thông tin, loại thước nào dưới đây được sử dụng để lựa chọn bóng rổ số 7 có chu vi 75 cm?", "opts": ["Thước thẳng.", "Thước cuộn.", "Thước dây.", "Thước kẹp."], "ans": "C"}, {"q": "Bàn học sinh có chiều dài khoảng 1 m. Thước nào sau đây có thể đo chiều dài bàn chính xác nhất?", "opts": ["Thước thẳng có GHĐ 30 cm và ĐCNN 1 mm.", "Thước thẳng có GHĐ 50 cm và ĐCNN 1 cm.", "Thước thẳng có GHĐ 1,5 m và ĐCNN 1 mm.", "Thước thẳng có GHĐ 30 cm và ĐCNN 1 cm."], "ans": "C"}, {"q": "Một học sinh dùng thước dây có GHĐ 6 m và ĐCNN 1 cm để đo chiều rộng lớp học. Trong các cách ghi kết quả đo dưới đây, cách ghi nào sai?", "opts": ["5,2 m.", "52,0 dm.", "520 cm.", "521 cm."], "ans": "A"}]}, {"name": "Bài 6. Đo khối lượng", "questions": [{"q": "Đơn vị đo khối lượng nào sau đây là nhỏ nhất?", "opts": ["gam.", "tạ.", "kilôgam.", "lạng."], "ans": "A"}, {"q": "Trên bao bì hộp kẹo ghi 100 g, số liệu đó chỉ", "opts": ["khối lượng của kẹo trong hộp.", "thể tích của kẹo trong hộp.", "khối lượng của cả hộp kẹo.", "thể tích của cả hộp kẹo."], "ans": "A"}, {"q": "Trên nhãn chai mật ong có ghi 1 lít – 1,3 kg. Ý nghĩa của thông tin đó là:", "opts": ["Thể tích chai 1 lít và khối lượng cả chai mật ong là 1,3 kg.", "Thể tích 1 lít mật ong có khối lượng 1,3 kg.", "Thể tích mật ong trong chai là 1 lít và khối lượng cả chai mật ong là 1,3 kg.", "Chai chỉ chứa được 1 lít mật ong và chai nặng 1,3 kg."], "ans": "B"}, {"q": "Trên gói bánh có ghi khối lượng 500… và bị mờ đơn vị. Đơn vị phù hợp điền vào chỗ trống là", "opts": ["kg.", "mg.", "lạng.", "g."], "ans": "D"}, {"q": "Phát biểu nào sau đây sai?", "opts": ["Để cân chính xác khối lượng của vật ta không cần quan tâm tới mặt phẳng đặt cân.", "Để cân chính xác khối lượng của vật ta cần điều chỉnh để kim cân chỉ đúng vạch số 0.", "Để đọc chính xác khối lượng vật cần đo ta phải đặt mắt nhìn vuông góc với vạch chia trên mặt cân ở đầu kim cân.", "Để cân chính xác khối lượng của vật ta cần đặt cân tại nơi bằng phẳng."], "ans": "A"}, {"q": "Cân nào sau đây phù hợp nhất để đo khối lượng một cây bắp cải?", "opts": ["Cân điện tử.", "Cân y tế.", "Cân Roberval.", "Cân tạ."], "ans": "A"}, {"q": "Dùng cân có ĐCNN là 0,1 kg để cân một quả dưa hấu. Kết quả nào sau đây phù hợp với việc dùng loại cân này?", "opts": ["2 200 g.", "2,2 kg.", "22 000 mg.", "2,25 kg."], "ans": "B"}, {"q": "Một cân đồng hồ có GHĐ là 1 kg; ĐCNN là 10 g. Mỗi phép đo của cân có thể sai số tối đa là bao nhiêu?", "opts": ["10 g.", "20 g.", "30 g.", "200 g."], "ans": "A"}]}, {"name": "Bài 7. Đo thời gian", "questions": [{"q": "Đơn vị nào không dùng để đo thời gian?", "opts": ["phút.", "km/h.", "giờ.", "giây."], "ans": "B"}, {"q": "Loại đồng hồ nào sau đây thường dùng để đo thời gian trong lớp học?", "opts": ["Đồng hồ treo tường.", "Đồng hồ đeo tay.", "Đồng hồ điện tử.", "Đồng hồ bấm giây."], "ans": "A"}, {"q": "Điều nào sau đây làm giảm sai số khi đo thời gian của một hoạt động bằng đồng hồ?", "opts": ["Đo nhiều lần rồi tính giá trị trung bình.", "Không hiệu chỉnh đồng hồ.", "Đặt mắt nhìn lệch.", "Đọc kết quả chậm."], "ans": "A"}, {"q": "Để đạt đến hình thái trưởng thành, con bướm mất khoảng 30 ngày, tương ứng với khoảng thời gian là", "opts": ["720 giờ.", "72 giờ.", "300 giờ.", "7 200 giờ."], "ans": "A"}, {"q": "Khi đo thời gian chạy 100 m của bạn An trong giờ thể dục, em dùng đồng hồ điện tử và sẽ bấm nút START/STOP vào thời điểm nào?", "opts": ["Ngay khi bạn An đứng ở vạch xuất phát.", "Trước khi bạn An chạy.", "Ngay khi bạn An chạy.", "Ngay khi có hiệu lệnh xuất phát và khi bạn An chạy về đích."], "ans": "C"}, {"q": "Bạn Lan đi xe đạp từ nhà lúc 6 giờ 30 phút, thời gian bạn Lan đi đến trường là 15 phút. Hỏi bạn Lan đến trường lúc mấy giờ?", "opts": ["6 giờ 55 phút.", "6 giờ 40 phút.", "7 giờ.", "7 giờ kém 15 phút."], "ans": "D"}, {"q": "Mai hẹn đến nhà bạn An làm bài tập lúc 14 giờ 30 phút. Mai ước lượng thời gian đến nhà An là 20 phút, vì vậy Mai đi từ nhà lúc 14 giờ 10 phút nhưng thực tế đến nhà An lúc 14 giờ 35 phút. Thời gian chênh lệch mà Mai ước lượng so với thời gian thực tế là bao nhiêu?", "opts": ["Ít hơn 5 phút.", "Nhiều hơn 5 phút.", "Ít hơn 55 phút.", "Nhiều hơn 0,5 giờ."], "ans": "A"}]}, {"name": "Bài 8. Đo nhiệt độ", "questions": [{"q": "Nhiệt kế nào sau đây hoạt động dựa trên hiện tượng dãn nở vì nhiệt của chất lỏng?", "opts": ["Nhiệt kế thuỷ ngân.", "Nhiệt kế kim loại.", "Nhiệt kế hồng ngoại.", "Nhiệt kế điện tử."], "ans": "A"}, {"q": "Ở 0 °C cột chất lỏng trong nhiệt kế cao 11 cm, ở 100 °C cột chất lỏng trong nhiệt kế cao 25 cm. Hỏi ở 50 °C, cột chất lỏng trong nhiệt kế cao bao nhiêu cm?", "opts": ["18 cm.", "7 cm.", "14 cm.", "10 cm."], "ans": "A"}, {"q": "Đơn vị đo nhiệt độ thường dùng trong đời sống ở Việt Nam là", "opts": ["Fahrenheit (°F).", "Celsius (°C).", "Kelvin (K).", "Joule (J)."], "ans": "B"}, {"q": "Loại nhiệt kế nào sau đây thường dùng để đo nhiệt độ cơ thể người?", "opts": ["Nhiệt kế thuỷ ngân dùng trong phòng thí nghiệm.", "Nhiệt kế y tế.", "Nhiệt kế đo nhiệt độ không khí.", "Nhiệt kế đo nhiệt độ nước."], "ans": "B"}]}]}, {"name": "Chương II. Chất quanh ta", "tests": [{"name": "Bài 1", "questions": [{"q": "Dãy nào dưới đây gồm các vật thể tự nhiên?", "opts": ["Cây xanh, xe ô tô, máy bay.", "Bát, đĩa, điện thoại thông minh.", "Cây xanh, núi đá vôi, biển.", "Cây cầu, con sông, con suối."], "ans": "C"}, {"q": "Dãy nào sau đây gồm các vật thể được làm bằng sắt?", "opts": ["Bút chì, xe đạp, xe máy.", "Xe đạp, ô tô, xe máy.", "Bóng đá, quả tạ, cầu sắt.", "Máy bay, ô tô, quyển sách."], "ans": "B"}, {"q": "Tính chất nào sau đây là của muối ăn (NaCl)?", "opts": ["Chất rắn, có vị mặn, tan trong nước.", "Chất lỏng, có vị mặn, nhiệt độ nóng chảy cao.", "Chất rắn, có vị ngọt, không tan trong nước.", "Chất rắn, có màu vàng, tan trong nước."], "ans": "A"}, {"q": "Nhỏ vài giọt giấm ăn vào cục đá vôi có thể nhận biết được tính chất nào sau đây của chất?", "opts": ["Màu sắc.", "Nhiệt độ nóng chảy.", "Tính chất hoá học của chất.", "Nhiệt độ sôi của chất."], "ans": "C"}, {"q": "Nhận xét nào sau đây nói về tính chất hoá học của sắt?", "opts": ["Cứng, màu trắng xám, bị nam châm hút.", "Để lâu ngoài không khí, lớp ngoài của sắt biến thành gỉ sắt màu nâu, giòn và xốp.", "Sắt dẻo có thể uốn thành nan hoa cửa.", "Nhiệt độ nóng chảy của sắt tương đối cao (khoảng 1500 °C)."], "ans": "B"}, {"q": "Dùng tay có thể uốn được dây điện bằng đồng đó là do đồng có tính chất nào sau đây?", "opts": ["Nhiệt độ nóng chảy tương đối cao.", "Dẫn được điện.", "Không tan trong nước.", "Có tính dẻo."], "ans": "D"}, {"q": "Người ta dùng nước có thể tách được cát ra khỏi hỗn hợp với muối ăn đó là vì:", "opts": ["Muối tan trong nước và cát không tan trong nước.", "Muối không tan trong nước, cát tan trong nước.", "Muối và cát đều là chất rắn.", "Cát có hạt to hơn muối."], "ans": "A"}, {"q": "Người ta đã nung kim loại đồng ở nhiệt độ cao, cho đồng chảy ra rồi đổ vào khuôn và để nguội, tạo thành bức tượng. Quá trình đúc tượng bằng đồng đã xảy ra hiện tượng:", "opts": ["Nóng chảy, bay hơi.", "Bay hơi, đông đặc.", "Nóng chảy, đông đặc.", "Ngưng tụ, bay hơi."], "ans": "C"}, {"q": "Nhận xét nào sau đây không đúng về khí oxygen?", "opts": ["Oxygen là chất khí không màu, có mùi.", "Oxygen cần thiết cho quá trình hô hấp.", "Oxygen có trong thành phần của không khí.", "Oxygen cần thiết cho quá trình đốt cháy."], "ans": "A"}, {"q": "Trong không khí có một chất khí rất trơ về mặt hoá học, chiếm phần lớn thể tích của không khí. Khí đó là khí nào dưới đây?", "opts": ["Carbon dioxide.", "Nitrogen", "Oxygen", "Hơi nước."], "ans": "B"}]}, {"name": "Bài 2", "questions": [{"q": "Dãy nào dưới đây gồm các vật thể nhân tạo?", "opts": ["Cây xanh, xe ô tô, máy bay.", "Tàu thuỷ, núi đá vôi, máy tính.", "Máy bay, chậu nhựa, điện thoại.", "Cây cầu, con sông, con suối."], "ans": "C"}, {"q": "Tính chất nào sau đây là của dầu ăn?", "opts": ["Chất lỏng, nhẹ hơn nước, không tan trong nước.", "Chất lỏng, có vị mặn, tan nhiều trong nước.", "Chất lỏng, có vị ngọt, không tan trong nước.", "Chất rắn, có màu vàng, tan tốt trong nước."], "ans": "A"}, {"q": "Vào những ngày trời nồm, khi đóng kín cửa chúng ta thường thấy những giọt nước bám trên cửa kính phía trong nhà. Hiện tượng đã xảy ra là", "opts": ["Ngưng tụ.", "Nóng chảy.", "Đông đặc.", "Bay hơi."], "ans": "A"}, {"q": "Khi đun nóng đường thì hiện tượng quan sát được là:", "opts": ["đường chuyển từ trạng thái lỏng sang rắn.", "xuất hiện màu đỏ.", "lúc đầu đường nóng chảy sau đó chuyển dần sang màu nâu và cuối cùng là màu đen.", "đường biến thành chất khí có màu vàng."], "ans": "C"}, {"q": "Để bảo vệ bầu không khí trong lành, người ta có thể:", "opts": ["Giảm lượng khí thải, trồng cây xanh.", "Đốt rừng làm nương rẫy, giảm lượng khí thải.", "Trồng nhiều cây xanh, xả rác không đúng nơi quy định.", "Đổ rác đúng nơi quy định, đốt rơm rạ."], "ans": "A"}, {"q": "Bạn An bắt được một con dế mèn rồi để vào một hộp kín có đầy đủ thức ăn và nước uống. Sau một thời gian, con dế bị chết. Con dế chết là do nguyên nhân nào dưới đây?", "opts": ["Con dế thiếu oxygen.", "Con dế buồn bực.", "Con dế không vận động.", "Con dế thiếu carbon dioxide."], "ans": "A"}, {"q": "Ô nhiễm không khí không do yếu tố nào cho dưới đây?", "opts": ["Khói nhà máy.", "Cháy rừng.", "Cây xanh quang hợp.", "Khói ô tô."], "ans": "C"}, {"q": "21% là giá trị nào cho dưới đây của oxygen trong không khí?", "opts": ["% về thể tích.", "% về khối lượng.", "% số nguyên tử.", "% về độ dày."], "ans": "A"}, {"q": "Trong bể nuôi cá cảnh, người ta thường phải bơm không khí vào nước để cung cấp thêm oxygen cho cá. Nguyên nhân của việc làm trên là do", "opts": ["oxygen ít tan trong nước.", "oxygen là chất khí.", "oxygen không màu.", "oxygen không mùi."], "ans": "A"}, {"q": "Mỗi giờ một người lớn hít vào trung bình 0,5 m³ không khí, cơ thể giữ lại 1/3 lượng oxygen có trong không khí đó. Một ngày đêm (24 giờ), một người lớn cần lượng khí oxygen (coi oxygen chiếm 21% thể tích không khí) là", "opts": ["12 000 lít.", "2 520 lít.", "840 lít.", "200 lít."], "ans": "C"}]}], "lessons": [{"name": "Bài 1. Sự đa dạng của chất", "questions": [{"q": "Dãy nào sau đây gồm các vật thể tự nhiên?", "opts": ["Cây xanh, động vật, máy bay.", "Cây xanh, con người, động vật.", "Cây cầu, núi đá vôi, con sông.", "Mặt Trăng, Mặt Trời, máy tính."], "ans": "B"}, {"q": "Dãy nào sau đây gồm các vật thể nhân tạo?", "opts": ["Điện thoại, máy tính, xe đạp.", "Xe máy, ô tô, con hổ.", "Bàn học, bút viết, đại dương.", "Núi đá vôi, sa mạc, đại dương."], "ans": "A"}, {"q": "Dãy nào sau đây gồm các vật sống?", "opts": ["Robot, con gà, sách vở.", "Con người, con gà, sông Hồng.", "Con voi, cây cà chua, con vẹt.", "Cây cầu, con thuyền, con chó."], "ans": "C"}, {"q": "Dãy nào sau đây gồm các vật không sống?", "opts": ["Cái bút, con thuyền, cây cối.", "Máy tính, con chim, tai nghe.", "Nhiệt kế, cốc thuỷ tinh, con trâu.", "Cái kính, con dao, cái thìa."], "ans": "D"}, {"q": "Dãy nào sau đây gồm các chất?", "opts": ["Đường kính trắng, muối ăn, nước.", "Không khí, thuỷ tinh, con sông.", "Cây cầu, dây đồng, bánh mì.", "Muối ăn, cao su, cái cốc."], "ans": "A"}, {"q": "Tính chất nào sau đây không phải của xăng?", "opts": ["Tồn tại ở thể lỏng.", "Không màu.", "Dễ cháy.", "Tan trong nước."], "ans": "D"}, {"q": "Tính chất nào sau đây là của nước ở điều kiện thường?", "opts": ["Là chất lỏng, không màu, không vị.", "Là chất rắn, có màu trắng.", "Không hoà tan được muối ăn, đường kính trắng.", "Có mùi khó chịu."], "ans": "A"}, {"q": "Người ta dựa vào tính chất nào sau đây của cao su để làm bóng?", "opts": ["Dẻo.", "Cứng.", "Cháy được.", "Đàn hồi."], "ans": "D"}, {"q": "Nhận xét nào sau đây nói về tính chất hoá học của sắt?", "opts": ["Cứng, màu trắng xám.", "Bị nam châm hút.", "Nhiệt độ nóng chảy khoảng 1500 °C.", "Để lâu ngoài không khí, lớp ngoài của sắt biến thành gỉ màu nâu, giòn và xốp."], "ans": "D"}, {"q": "Khi cho một ít đường kính trắng và muối ăn vào cốc nước, khuấy đều thì quan sát được hiện tượng nào dưới đây?", "opts": ["Muối ăn và đường đều không tan trong nước.", "Muối ăn và đường đều tan trong nước.", "Muối ăn tan trong nước, đường không tan trong nước.", "Muối ăn không tan trong nước, đường tan trong nước."], "ans": "B"}]}, {"name": "Bài 2. Các thể của chất và sự chuyển thể", "questions": [{"q": "Cho các chất sau: đường kính trắng, muối ăn, dầu ăn, nước, khí oxygen, khí carbon dioxide. Số chất tồn tại ở thể lỏng (ở điều kiện thường) là", "opts": ["2.", "3.", "1.", "6."], "ans": "A"}, {"q": "Khi mở lọ nước hoa, một lát sau có thể ngửi thấy mùi nước hoa. Điều này thể hiện tính chất nào sau đây của chất khí?", "opts": ["Dễ bị nén.", "Không có hình dạng xác định.", "Không có kích thước xác định.", "Dễ dàng lan toả trong không gian theo mọi hướng."], "ans": "D"}, {"q": "Nước từ nhà máy được dẫn đến các hộ dân qua các đường ống. Điều này thể hiện tính chất gì của chất ở thể lỏng?", "opts": ["Có hình dạng của phần vật chứa nó.", "Khó nén.", "Dễ bay hơi.", "Có thể rót được và chảy tràn trên bề mặt (có thể tự di chuyển)."], "ans": "D"}, {"q": "Ta có thể đi được trên bề mặt của nước đóng băng. Điều này thể hiện tính chất gì của chất ở thể rắn?", "opts": ["Có hình dạng xác định.", "Có kích thước xác định.", "Không tự di chuyển được.", "Rất khó nén."], "ans": "D"}, {"q": "Nhiệt độ nóng chảy của sắt, thiếc, thuỷ ngân, nước lần lượt là 1530 °C; 232 °C; −39 °C; 0 °C. Hãy cho biết chất nào là chất lỏng ở nhiệt độ 0 °C?", "opts": ["Sắt.", "Thiếc.", "Thuỷ ngân.", "Nước."], "ans": "C"}, {"q": "Khi để cục nước đá ở nhiệt độ phòng một thời gian, em thấy có hiện tượng gì xảy ra?", "opts": ["Cục nước đá tự di chuyển sang vị trí khác.", "Cục nước đá chuyển thành nước lỏng và chảy lan trên bề mặt.", "Cục nước đá chuyển thành hơi nước.", "Hơi nước trong không khí ngưng tụ thành nước đá làm cho cục nước đá to lên."], "ans": "B"}, {"q": "Hiện tượng hơi nước chuyển thành nước ở thể lỏng được gọi là hiện tượng nào dưới đây?", "opts": ["Bay hơi.", "Ngưng tụ.", "Nóng chảy.", "Đông đặc."], "ans": "B"}, {"q": "Nhận xét nào sau đây đúng?", "opts": ["Quá trình chuyển từ thể hơi sang thể lỏng gọi là sự bay hơi.", "Quá trình chuyển từ thể lỏng sang thể hơi gọi là sự ngưng tụ.", "Sự hoá hơi xảy ra trên bề mặt chất lỏng gọi là sự bay hơi, khi xảy ra cả trên bề mặt chất lỏng và trong khối chất lỏng thì gọi là sự sôi.", "Sự ngưng tụ và sự bay hơi xảy ra ở nhiệt độ sôi còn sự sôi xảy ra ở mọi nhiệt độ."], "ans": "C"}, {"q": "Phơi quần áo nơi có nắng hoặc gió thì quần áo khô nhanh hơn. Theo em, nắng và gió ảnh hưởng thế nào đến sự bay hơi nhanh, chậm của nước?", "opts": ["Nắng làm cho quá trình bay hơi của nước xảy ra nhanh hơn, gió làm cho quá trình bay hơi của nước xảy ra chậm hơn.", "Nắng làm cho quá trình bay hơi của nước xảy ra chậm hơn, gió làm cho quá trình bay hơi của nước xảy ra nhanh hơn.", "Nắng và gió làm cho quá trình bay hơi của nước xảy ra nhanh hơn.", "Nắng và gió làm cho quá trình bay hơi của nước xảy ra chậm hơn."], "ans": "C"}, {"q": "Nhận xét nào sau đây sai?", "opts": ["Ở thể rắn, các hạt được sắp xếp theo một trật tự nhất định và chỉ dao động xung quanh một vị trí cố định.", "Ở thể khí, các hạt di chuyển tự do và chiếm đầy vật chứa nó.", "Ở thể lỏng, các hạt không ở vị trí cố định, có thể di chuyển tự do và trượt lên nhau.", "Ở nhiệt độ thường, khoảng cách giữa các hạt ở thể rắn, lỏng và khí là như nhau."], "ans": "D"}]}, {"name": "Bài 3. Oxygen và không khí", "questions": [{"q": "Nhận xét nào sau đây sai?", "opts": ["Con người, động vật, thực vật sống trên bề mặt Trái Đất khi hô hấp cần oxygen. Điều đó chứng tỏ oxygen có trong không khí.", "Các loài giun, vi khuẩn sống trong đất cần oxygen khi hô hấp. Do đó oxygen có trong đất.", "Các loài cá, loài thuỷ sinh sống hoàn toàn trong nước cũng cần oxygen khi hô hấp. Do đó oxygen có trong nước.", "Con người có thể di chuyển, khám phá Mặt Trăng. Do đó, oxygen cũng có sẵn trên Mặt Trăng."], "ans": "D"}, {"q": "Tính chất vật lí nào sau đây không phải của oxygen (ở điều kiện thường)?", "opts": ["Là chất khí, không màu, không mùi.", "Ít tan trong nước.", "Hoá lỏng ở nhiệt độ −183 °C. Oxygen lỏng có màu xanh nhạt.", "Khí oxygen trong không khí có màu vàng."], "ans": "D"}, {"q": "Quá trình nào dưới đây không làm giảm lượng oxygen trong không khí?", "opts": ["Sự gỉ của các vật dụng bằng sắt.", "Sự cháy của than, củi, bếp ga.", "Sự quang hợp của cây xanh.", "Sự hô hấp của động vật."], "ans": "C"}, {"q": "Phần trăm về thể tích của không khí là", "opts": ["80% oxygen; 20% nitrogen.", "20% oxygen; 80% nitrogen.", "21% oxygen; 78% nitrogen; 1% khí khác (carbon dioxide, hơi nước,...).", "78% oxygen; 22% nitrogen."], "ans": "C"}, {"q": "Oxygen có tầm quan trọng đối với", "opts": ["sự hô hấp.", "sự đốt nhiên liệu.", "dập tắt các đám cháy.", "sự hô hấp và sự đốt cháy nhiên liệu."], "ans": "D"}, {"q": "Gắn một cây nến lên đáy chậu thuỷ tinh rồi đổ một cốc nước đầy vào chậu. Úp một cốc thuỷ tinh lên cây nến đang cháy, hiện tượng quan sát được là:", "opts": ["Cây nến cháy một lúc rồi tắt, nước dâng lên trong cốc.", "Cây nến cứ cháy mãi đến khi hết nến thì tắt, mực nước trong cốc và ngoài cốc không thay đổi.", "Cây nến cháy, mực nước dâng lên đầy cốc.", "Cây nến tắt ngay, nước dâng lên trong cốc."], "ans": "A"}, {"q": "Nhận xét nào sau đây sai về vai trò của không khí?", "opts": ["Sự luân chuyển không khí giúp điều hoà khí hậu, khiến bề mặt Trái Đất không quá nóng hoặc quá lạnh. Ngoài ra, không khí còn có tác dụng bảo vệ Trái Đất khỏi các thiên thạch rơi từ vũ trụ, do khi cọ xát với không khí, các thiên thạch bốc cháy hoặc bay hơi gần hết.", "Oxygen trong không khí chỉ cần cho sự hô hấp của động vật, đốt cháy nhiên liệu hoá thạch.", "Nitrogen trong không khí được chuyển hoá thành nitrogen cần thiết cho cây cối (dạng phân bón tự nhiên).", "Carbon dioxide (khí cacbonic) cần thiết cho quá trình quang hợp của cây xanh."], "ans": "B"}, {"q": "\"Carbon dioxide không phải là khí độc (1) nhưng có nhiều trong không khí thì có hại cho sức khoẻ con người (2)\". Phát biểu trên gồm hai ý. Hãy cho biết ý nào đúng, ý nào sai?", "opts": ["Ý 1, 2 đúng.", "Ý 1 sai, ý 2 đúng.", "Ý 1 đúng, ý 2 sai.", "Ý 1, 2 đều sai."], "ans": "A"}, {"q": "Không khí bị ô nhiễm không do nguyên nhân nào dưới đây?", "opts": ["Cháy rừng.", "Núi lửa phun trào.", "Khí thải của các nhà máy, phương tiện giao thông không được xử lí.", "Sự quang hợp của cây xanh."], "ans": "D"}, {"q": "Khí nào trong không khí là tác nhân chính gây ra hiện tượng \"hiệu ứng nhà kính\"?", "opts": ["Oxygen (O2).", "Nitrogen (N2).", "Carbon dioxide (CO2).", "Ozone (O3)."], "ans": "C"}, {"q": "Khí X được sinh ra do quá trình đốt cháy các nhiên liệu hoá thạch. Khí X là nguyên nhân chính gây ra hiện tượng mưa acid, làm phá huỷ các công trình xây dựng, giảm chất lượng đất, gây ảnh hưởng lớn tới các loài thuỷ sinh và thực vật. X là khí nào dưới đây?", "opts": ["Carbon dioxide (CO2).", "Methane (CH4).", "Sulfur dioxide (SO2).", "Nitrogen (N2)."], "ans": "C"}, {"q": "Để bảo vệ không khí không bị ô nhiễm, mỗi cá nhân cần hành động mạnh mẽ để bảo vệ môi trường sống. Một số giải pháp: 1. Thay thế dần năng lượng hoá thạch bằng năng lượng tái tạo, năng lượng sạch. 2. Hướng dẫn người dân sử dụng năng lượng hợp lí, tiết kiệm. 3. Đề ra những quy định nghiêm ngặt về xử lí khí thải, chất thải độc hại. 4. Trồng và bảo vệ cây xanh. 5. Học sinh cần giữ gìn vệ sinh cá nhân; vệ sinh khu vực sống và học tập của mình; bỏ rác đúng nơi quy định. Những giải pháp đúng, cần thực hiện là:", "opts": ["1, 2, 3.", "2, 3, 4.", "3, 4, 5.", "1, 2, 3, 4, 5."], "ans": "D"}, {"q": "Mỗi giờ một người lớn hít vào trung bình 500 lít không khí, cơ thể giữ lại 1/3 lượng oxygen có trong không khí đó. Hỏi một ngày đêm (24 giờ), một người lớn cần bao nhiêu lít khí oxygen (coi oxygen chiếm 21% thể tích không khí)?", "opts": ["12 000.", "2 520.", "840.", "200."], "ans": "C"}]}]}, {"name": "Chương III. Một số vật liệu, nhiên liệu, nguyên liệu, lương thực – thực phẩm", "tests": [{"name": "Bài 1", "questions": [{"q": "Vật liệu nào sau đây không có tính dẫn điện?", "opts": ["Nhôm.", "Sắt.", "Đồng.", "Nhựa."], "ans": "D"}, {"q": "Vật liệu nào sau đây có tính chất trong suốt?", "opts": ["Gỗ.", "Giấy.", "Thuỷ tinh.", "Gốm."], "ans": "C"}, {"q": "Vật liệu nào sau đây dễ bị mốc?", "opts": ["Gỗ.", "Nhựa cứng.", "Inox.", "Nhôm."], "ans": "A"}, {"q": "Sản phẩm nào dưới đây chứa chất tinh bột?", "opts": ["Gạo.", "Thịt.", "Rau xanh.", "Mỡ động vật."], "ans": "A"}, {"q": "Cho các nhóm chất sau: (1) Chất đạm. (2) Chất tinh bột, đường. (3) Chất béo. (4) Chất khoáng, vitamin. (5) Chất xơ. Nhóm chất nào cung cấp năng lượng cho cơ thể?", "opts": ["(1), (2), (5).", "(2), (3), (4).", "(1), (3), (5).", "(1), (2), (3)."], "ans": "D"}, {"q": "Nhóm chất nào sau đây giúp cơ thể tăng sức đề kháng?", "opts": ["Tinh bột, đường.", "Vitamin, khoáng chất.", "Chất béo.", "Chất đạm."], "ans": "B"}, {"q": "Vitamin giúp cơ thể hấp thụ tốt calcium là", "opts": ["Vitamin A.", "Vitamin C.", "Vitamin D.", "Vitamin B1."], "ans": "C"}, {"q": "Nguyên liệu để sản xuất đường kính trắng là", "opts": ["cây lúa.", "cây mía.", "cây ngô.", "các loại hạt."], "ans": "B"}, {"q": "Thịt, cá, tôm là …(1)… cung cấp …(2)… cho các bữa ăn hằng ngày. (1), (2) lần lượt là:", "opts": ["lương thực, chất đạm.", "thực phẩm, chất đạm.", "thực phẩm, chất béo.", "vật liệu, chất đạm."], "ans": "B"}, {"q": "Việc làm nào dưới đây không đảm bảo sử dụng nguyên liệu an toàn, hiệu quả và phát triển bền vững?", "opts": ["Tuân thủ các quy định an toàn lao động.", "Xử lí tốt các chất thải trong quá trình sản xuất.", "Xử lí bụi, tiếng ồn không ảnh hưởng môi trường xung quanh.", "Khai thác bừa bãi không theo quy định."], "ans": "D"}]}, {"name": "Bài 2", "questions": [{"q": "Nguyên liệu được con người lấy từ tự nhiên. Một số nguyên liệu thông dụng là:", "opts": ["Đá vôi, đất sét, gốm.", "Dầu mỏ, đá vôi, quặng.", "Đá vôi, dầu mỏ, thuỷ tinh.", "Đá vôi, quặng, dầu ăn."], "ans": "B"}, {"q": "Để làm ấm điện đun nước người ta sử dụng vật liệu chính nào sau đây?", "opts": ["Gỗ.", "Nhựa.", "Inox.", "Cao su."], "ans": "C"}, {"q": "Kim loại sắt để lâu ngoài không khí sẽ có hiện tượng nào sau đây?", "opts": ["Kim loại bóng sáng lên.", "Kim loại bị gỉ có màu nâu đỏ.", "Kim loại bị nóng chảy ra.", "Kim loại bị gỉ có màu xanh."], "ans": "B"}, {"q": "Người ta có thể sử dụng các nguồn nhiệt sau để đun nấu. Nguồn nhiệt nào sau đây không phải là nhiên liệu?", "opts": ["Than.", "Củi.", "Điện.", "Khí ga."], "ans": "C"}, {"q": "Để tìm hiểu khả năng dẫn nhiệt của vật liệu, thí nghiệm nào sau đây thực hiện đúng?", "opts": ["Đổ nước nóng vào bát sứ đựng thìa bằng các vật liệu khác nhau: nhựa, kim loại, sứ, gỗ.", "Cho từng vật liệu vào dung dịch acid.", "Đổ nước lạnh vào bát sứ đựng các thìa bằng các vật liệu khác nhau: nhựa, kim loại, sứ, gỗ.", "Cho các vật liệu vào cốc đựng nước rồi đun nóng."], "ans": "A"}, {"q": "Khi sử dụng bếp ga, thấy khí ga rò rỉ, ta phải thực hiện các bước sau: a) Mở hết các cửa để khí ga thoát ra ngoài. b) Khoá van bình ga. c) Không mở hay tắt bất kì công tắc điện, thiết bị điện, không sử dụng điện thoại tại đó. d) Kiểm tra vị trí rò rỉ khí ga. Thứ tự các bước thực hiện đúng là:", "opts": ["b, a, c, d.", "d, a, b, c.", "c, d, b, a.", "d, c, a, b."], "ans": "A"}, {"q": "Để phân biệt hai loại vật liệu cao su và nhựa, người ta dựa vào tính chất nào sau đây?", "opts": ["Dẻo.", "Không thấm nước.", "Không dẫn điện.", "Đàn hồi."], "ans": "D"}, {"q": "Thực đơn cho một bữa ăn để đảm bảo đủ chất dinh dưỡng là", "opts": ["Thịt, rau, dầu ăn, cá.", "Dầu ăn, mỡ lợn, cá, tôm.", "Đậu, thịt, rau, dầu ăn, gạo.", "Khoai, gạo, thịt, rau."], "ans": "C"}, {"q": "Cách bảo quản lương thực như lúa, ngô tránh bị hỏng và mốc là", "opts": ["để nơi thoáng gió.", "thu hoạch về để trong bình kín.", "để nơi ẩm thấp.", "phơi thật khô và để nơi khô ráo."], "ans": "D"}, {"q": "Gạo, ngô, khoai, sắn là …(1)… cung cấp chất …(2)… cho các bữa ăn hằng ngày. (1), (2) lần lượt là:", "opts": ["lương thực, tinh bột.", "thực phẩm, chất đạm.", "thực phẩm, chất béo.", "lương thực, chất đạm."], "ans": "A"}]}], "lessons": [{"name": "Bài 9. Một số vật liệu", "questions": [{"q": "Con người đã chế tạo ra một số vật liệu không có trong tự nhiên. Một số vật liệu thông dụng là:", "opts": ["đất sét, cao su, thuỷ tinh, gốm.", "thép, gốm, cao su, cát.", "thép, gốm, thuỷ tinh, cao su.", "nhựa, gốm, thuỷ tinh, quặng."], "ans": "C"}, {"q": "Vật liệu nào cho dưới đây có tính chất dẫn điện?", "opts": ["Nhôm.", "Gỗ.", "Thuỷ tinh.", "Nhựa."], "ans": "A"}, {"q": "Vật liệu nào cho dưới đây không có tính chất cách điện?", "opts": ["Cao su.", "Gỗ.", "Sắt.", "Nhựa."], "ans": "C"}, {"q": "Vật liệu nào cho dưới đây dùng làm lốp xe?", "opts": ["Gốm.", "Nhựa.", "Thuỷ tinh.", "Cao su."], "ans": "D"}, {"q": "Cái bàn học thường được làm từ các vật liệu nào cho dưới đây?", "opts": ["Gỗ, thép, nhựa.", "Gỗ, cao su, thuỷ tinh.", "Gố ười có nguồn gốc thực vật gồm: lương thực (nhóm 1), các loại hạt (nhóm 2), củ quả khác (nhóm 7), rau củ quả màu vàng/đỏ/xanh thẫm (nhóm 6). Đó là các nhóm số:", "opts": ["1, 2, 6, 7.", "1, 3, 4.", "4, 5, 8.", "3, 5, 7, 8."], "ans": "A"}, {"q": "Trong sơ đồ tháp dinh dưỡng gồm 8 nhóm thực phẩm, nhóm cung cấp chất béo cho cơ thể (dầu ăn, mỡ các loại) là nhóm số:", "opts": ["1, 6, 7.", "3, 4.", "5, 8.", "2, 8."], "ans": "D"}, {"q": "Nhóm cung cấp chất đạm cho cơ thể (các loại hạt, thịt cá hải sản, trứng và sản phẩm từ trứng) là nhóm số:", "opts": ["1, 6, 7.", "1, 3, 4.", "3, 4, 5.", "2, 5, 7."], "ans": "C"}, {"q": "Thành phần dinh dưỡng cho một bữa ăn hợp lí gồm:", "opts": ["cơm, ngô, lạc, sữa, cá, trứng.", "quả đỗ, khoai, gạo, sữa, cá.", "cơm, thịt, dầu ăn, bắp cải, bí đỏ.", "cá, thịt, cơm, sữa, trứng."], "ans": "C"}, {"q": "Khẩu phần cho một bữa ăn nên có nhiều loại thức ăn khác nhau để", "opts": ["phù hợp cho các thành viên khác nhau trong gia đình.", "cơ thể được cung cấp nhiều chất đạm khác nhau.", "cơ thể được cung cấp đầy đủ các nhóm chất dinh dưỡng khác nhau.", "cơ thể được cung cấp nhiều loại vitamin khác nhau."], "ans": "C"}]}]}, {"name": "Chương IV. Hỗn hợp, tách chất ra khỏi hỗn hợp", "tests": [{"name": "Bài 1", "questions": [{"q": "Dung dịch là", "opts": ["hỗn hợp đồng nhất của chất rắn và chất lỏng.", "hỗn hợp đồng nhất của chất khí và chất lỏng.", "hỗn hợp đồng nhất của hai chất lỏng.", "hỗn hợp đồng nhất của chất tan và dung môi."], "ans": "D"}, {"q": "Khi tăng nhiệt độ thì độ tan của chất rắn trong nước", "opts": ["đều tăng", "đều giảm", "phần lớn tăng", "phần lớn giảm"], "ans": "C"}, {"q": "Khi hoà tan đường vào nước thì:", "opts": ["Đường là chất tan và nước là dung môi.", "Nước và đường đều là chất tan.", "Nước là chất tan và đường là dung môi.", "Nước và đường đều là dung môi."], "ans": "A"}, {"q": "Một hỗn hợp gồm cát và muối ăn. Muốn tách chúng ra khỏi nhau, người ta hoà tan hỗn hợp vào nước, sau đó lần lượt thực hiện phương pháp:", "opts": ["Lọc, chiết.", "Lọc, cô cạn.", "Cô cạn, lọc.", "Chiết, cô cạn."], "ans": "B"}, {"q": "Trường hợp nào dưới đây không phải là hỗn hợp?", "opts": ["Không khí.", "Nước biển.", "Nước mía.", "Oxygen."], "ans": "D"}, {"q": "Phát biểu nào dưới đây là đúng?", "opts": ["Nước đường là hỗn hợp không đồng nhất của đường với nước.", "Cát lơ lửng trong nước biển tạo thành nhũ tương.", "Tách muối ăn ra khỏi nước biển dùng phương pháp làm bay hơi.", "Tách đường ra khỏi nước đường dùng phương pháp lắng gạn."], "ans": "C"}, {"q": "Vật thể nào sau đây chỉ chứa một chất duy nhất?", "opts": ["Bút mực.", "Nhẫn vàng.", "Xe đạp.", "Nồi inox."], "ans": "B"}, {"q": "Chất nào sau đây tan nhiều trong nước nóng?", "opts": ["Đường ăn.", "Khí oxygen.", "Khí carbon dioxide.", "Bột đá vôi."], "ans": "A"}, {"q": "Tiến hành các thí nghiệm sau: (1) Lấy 1 thìa bột sắn dây cho vào cốc nước khuấy đều. (2) Lấy 1 thìa bột đá vôi cho vào cốc nước khuấy đều. (3) Lấy 1 thìa dầu ăn cho vào cốc nước khuấy đều. (4) Lấy 1 thìa muối ăn cho vào cốc nước khuấy đều. Thí nghiệm thu được dung dịch là", "opts": ["(1).", "(2).", "(3).", "(4)."], "ans": "D"}, {"q": "Biết đường ăn là chất tan nhiều trong nước. Cứ 100 g nước có thể hoà tan 204 g đường. Biết 100 g nước tương ứng 100 ml nước; 1 lít nước có thể hoà tan được khối lượng đường là", "opts": ["204 kg.", "102 kg.", "2,04 kg.", "20,4 kg."], "ans": "C"}]}, {"name": "Bài 2", "questions": [{"q": "Trộn hai chất sau với nhau theo tỉ lệ 1:1 rồi khuấy đều. Hỗn hợp nào sau đây là dung dịch?", "opts": ["Cát và nước.", "Đường và nước.", "Dầu ăn và nước", "Dầu ăn và đường."], "ans": "B"}, {"q": "Khi giảm nhiệt độ thì độ tan của chất rắn trong nước", "opts": ["Đều tăng.", "Đều giảm.", "Phần lớn tăng.", "Phần lớn giảm."], "ans": "D"}, {"q": "Chất chỉ có một chất duy nhất được gọi là", "opts": ["chất tinh khiết.", "hỗn hợp", "huyền phù.", "nhũ tương."], "ans": "A"}, {"q": "Tiến hành các thí nghiệm sau: (1) Lấy 1 thìa bột sắn dây cho vào cốc nước, khuấy đều. (2) Lấy 1 thìa bột đá vôi ch ["(2), (3), (4).", "(1), (2), (4).", "(1), (2), (3).", "(1), (3), (4)."], "ans": "A"}, {"q": "Bạn Bình trồng hai cây xanh vào hai chậu A, B kích cỡ bằng nhau, sau một thời gian hai cây có kích thước tương đương nhau. Cây ở chậu A vẫn tưới nước bình thường; cây ở chậu B không tưới nước trong thời gian dài. Điều gì sẽ xảy ra?", "opts": ["Cây ở chậu A bị héo, cây ở chậu B sống bình thường.", "Cây trong cả 2 chậu đều chết.", "Cây trong cả 2 chậu đều sống.", "Cây ở chậu B bị héo, cây ở chậu A sống bình thường."], "ans": "D"}, {"q": "Cho các phát biểu: (1) Cây nến và con thỏ đều lấy khí oxygen từ môi trường và trả cho môi trường khí carbon dioxide. (2) Cây nến lấy khí oxygen từ môi trường và trả cho môi trường khí carbon dioxide để tồn tại. (3) Con thỏ lấy khí oxygen từ môi trường và trả cho môi trường khí carbon dioxide để tồn tại. (4) Vật sống và vật không sống đều có quá trình trao đổi chất với môi trường. (5) Quá trình trao đổi chất với môi trường giúp vật sống tồn tại; còn vật không sống bị phân huỷ. Số phát biểu đúng là", "opts": ["2.", "3.", "4.", "5."], "ans": "B"}, {"q": "Cho các ý sau: (1) Tất cả các sinh vật đều là cơ thể đa bào. (2) Mô là cấp độ nhỏ hơn để xây dựng lên cấp độ lớn hơn là hệ cơ quan. (3) Cơ thể người chỉ có một hệ cơ quan duy nhất duy trì toàn bộ hoạt động sống của cơ thể. (4) Thực vật có hai hệ cơ quan là hệ chồi và hệ rễ. Số nhận định đúng là", "opts": ["1.", "2.", "3.", "4."], "ans": "A"}, {"q": "Các cấp tổ chức của cơ thể đa bào được sắp xếp theo thứ tự từ lớn đến bé là", "opts": ["Tế bào → Cơ quan → Hệ cơ quan → Cơ thể → Mô.", "Mô → Tế bào → Hệ cơ quan → Cơ quan → Cơ thể.", "Tế bào → Mô → Hệ cơ quan → Cơ quan → Cơ thể.", "Cơ thể → Hệ cơ quan → Cơ quan → Mô → Tế bào."], "ans": "D"}]}, {"name": "Bài 2", "questions": [{"q": "Cho các phát biểu: a) Mô gồm nhóm các tế bào cùng thực hiện một chức năng. b) Cơ quan gồm nhiều tế bào có cấu tạo giống nhau và cùng thực hiện một chức năng. c) Cơ quan được cấu tạo từ hai hay nhiều mô, cùng thực hiện một hoạt động sống. d) Hệ cơ quan gồm một nhóm các cơ quan phối hợp với nhau thực hiện đầy đủ các quá trình sống cơ bản, đảm bảo sự tồn tại và phát triển của cơ thể. e) Não, tim, dạ dày là các mô ở cơ thể người. g) Một số mô của cơ thể người như mô cơ, mô liên kết, mô biểu bì ở da. h) Một số hệ cơ quan của cơ thể người như hệ tiêu hoá, hệ hô hấp, hệ thần kinh. Số phát biểu đúng là", "opts": ["4.", "5.", "6.", "7."], "ans": "A"}, {"q": "Vật nào sau đây là vật sống?", "opts": ["Con dao.", "Vi khuẩn.", "Cây nến.", "Cây vợt."], "ans": "B"}, {"q": "Bạn An bắt hai con châu chấu kích cỡ bằng nhau cho vào hai bình thuỷ tinh riêng biệt. Đậy kín miệng bình thứ nhất bằng nút cao su, miệng bình thứ hai được bọc lại bằng miếng vải màn. Điều gì sẽ xảy ra với châu chấu ở hai bình?", "opts": ["Châu chấu trong bình thứ nhất chết, châu chấu trong bình thứ hai sống.", "Châu chấu trong cả hai bình đều chết.", "Châu chấu trong cả hai bình đều sống.", "Châu chấu trong bình thứ nhất sống, châu chấu trong bình thứ hai chết."], "ans": "A"}, {"q": "Hệ chồi ở thực vật bao gồm các cơ quan nào?", "opts": ["Rễ, thân, lá.", "Cành, lá, hoa, quả.", "Hoa, quả, hạt.", "Rễ, cành, lá, hoa."], "ans": "B"}, {"q": "Dạ dày được cấu tạo từ các cấp độ tổ chức nhỏ hơn nào?", "opts": ["Mô và hệ cơ quan.", "Tế bào và cơ quan.", "Tế bào và mô.", "Cơ quan và hệ cơ quan."], "ans": "C"}, {"q": "Nhóm nào dưới đây bao gồm các động vật đơn bào?", "opts": ["Tảo lục, vi khuẩn gây bệnh uốn ván.", "Tảo lục, con bướm.", "Em bé, cây hoa mai.", "Cây hoa mai, vi khuẩn gây bệnh uốn ván."], "ans": "A"}, {"q": "Nối mỗi dữ kiện ở cột A (1.Cảm ứng và vận động 2.Hô hấp 3.Bài tiết 4.Dinh dưỡng 5.Sinh sản 6.Sinh trưởng) với nội dung cột B (a.quá trình tạo ra con non; b.quá trình loại bỏ các chất thải; c.quá trình cảm nhận và phản ứng với sự thay đổi của môi trường; d.quá trình cơ thể lớn lên về kích thước; e.quá trình lấy thức ăn, nước uống biến đổi thành chất dinh dưỡng nuôi cơ thể; g.quá trình lấy oxygen và thải carbon dioxide qua hít
