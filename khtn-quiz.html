<script>
// ============ State ============
// route: {view:'home'} | {view:'chapter', si, ci, mode} | {view:'quiz', si, ci, mode, ti} | {view:'result', si, ci, mode, ti}
// si = subject index into SUBJECTS. mode: 'test' (Đề kiểm tra) | 'lesson' (Bài học thật)
let route = { view: 'home', si: 0 };
let quizState = null;
let resultsStore = {}; // key "si-mode-ci-ti" -> {score, total, answers}

const app = document.getElementById('app');
const romanChap = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];

function currentSubject() {
  return SUBJECTS[route.si];
}
function unitsFor(ch, mode) {
  return mode === 'lesson' ? ch.lessons : ch.tests;
}
function chapterShortName(ch) {
  return ch.name.replace(/^Chương\s+[IVX]+\.\s*/,'').replace(/^Bài\s+[\d–-]+\.\s*/,'');
}
function chapterNum(ci) {
  return ci < romanChap.length ? romanChap[ci] : (ci+1);
}
function extractBaiNum(name) {
  const m = name.match(/Bài\s+([\d–-]+)/i);
  return m ? m[1] : '';
}
function isFlatChapter(ch) {
  // KHTN8-style: exactly one test, no lessons -> skip the chapter list page
  return ch.tests.length === 1 && !ch.lessons;
}

function render() {
  window.scrollTo({top:0, behavior:'instant'});
  if (route.view === 'home') return renderHome();
  if (route.view === 'chapter') return renderChapter();
  if (route.view === 'quiz') return renderQuiz();
  if (route.view === 'result') return renderResult();
}

function crumbs(parts) {
  let html = '<div class="crumbs">';
  parts.forEach((p, i) => {
    if (i > 0) html += '<span class="sep">/</span>';
    if (i === parts.length - 1) html += `<span class="current">${p.label}</span>`;
    else html += `<button data-idx="${i}">${p.label}</button>`;
  });
  html += '</div>';
  return html;
}

function header() {
  return `
  <div class="site-head">
    <div class="mark" id="go-home">Bộ đề trắc nghiệm <small>Kiểm tra trắc nghiệm</small></div>
    <div class="tagline">${currentSubject().name} — theo bài học SGK hoặc theo đề kiểm tra.</div>
  </div>`;
}

function attachHeader() {
  document.getElementById('go-home').onclick = () => { route = {view:'home', si:route.si}; render(); };
}

function subjectTabs() {
  let tabs = SUBJECTS.map((s, i) => `
    <button class="subj-tab ${i===route.si?'active':''}" data-si="${i}">${s.name}</button>
  `).join('');
  return `<div class="subj-tabs">${tabs}</div>`;
}

// ============ HOME ============
function renderHome() {
  const subj = currentSubject();
  let cards = subj.chapters.map((ch, ci) => {
    const testQ = ch.tests.reduce((s,t)=>s+t.questions.length,0);
    const hasLessons = !!ch.lessons;
    const lessonQ = hasLessons ? ch.lessons.reduce((s,l)=>s+l.questions.length,0) : 0;
    const flat = isFlatChapter(ch);
    let meta;
    if (flat) {
      meta = `${testQ} câu trắc nghiệm`;
    } else {
      meta = `${ch.tests.length} đề kiểm tra · ${testQ} câu${hasLessons ? ` &nbsp;·&nbsp; ${ch.lessons.length} bài học · ${lessonQ} câu` : ''}`;
    }
    return `
    <button class="chapter-card" data-ci="${ci}">
      <div class="num">${flat ? 'BÀI ' + extractBaiNum(ch.name) : 'CHƯƠNG ' + chapterNum(ci)}</div>
      <h3>${chapterShortName(ch)}</h3>
      <div class="meta">${meta}</div>
    </button>`;
  }).join('');

  app.innerHTML = `
    ${header()}
    ${subjectTabs()}
    <div class="home-lead">
      <h1>Chọn ${subj.chapters.some(c=>!isFlatChapter(c)) ? 'chương' : 'bài'} để ôn tập</h1>
      <p>Mỗi mục có thể ôn theo <strong>bài học</strong> trong SGK, theo <strong>đề kiểm tra</strong>, hoặc làm thẳng bộ câu hỏi của bài đó.</p>
    </div>
    <div class="chapter-grid">${cards}</div>
    <footer class="note">Dữ liệu trích từ sách giáo khoa và tài liệu ôn tập tương ứng.</footer>
  `;
  attachHeader();
  app.querySelectorAll('.subj-tab').forEach(el => {
    el.onclick = () => { route = {view:'home', si:+el.dataset.si}; render(); };
  });
  app.querySelectorAll('.chapter-card').forEach(el => {
    el.onclick = () => {
      const ci = +el.dataset.ci;
      const ch = subj.chapters[ci];
      if (isFlatChapter(ch)) {
        startQuiz(ci, 'test', 0);
      } else {
        const hasLessons = !!ch.lessons;
        route = {view:'chapter', si:route.si, ci, mode: hasLessons ? 'lesson' : 'test'};
        render();
      }
    };
  });
}

// ============ CHAPTER ============
function renderChapter() {
  const subj = currentSubject();
  const ch = subj.chapters[route.ci];
  const hasLessons = !!ch.lessons;
  const mode = route.mode;
  const units = unitsFor(ch, mode);

  const modeSwitcher = hasLessons ? `
    <div class="mode-tabs">
      <button class="mode-tab ${mode==='lesson'?'active':''}" data-mode="lesson">Theo bài học SGK</button>
      <button class="mode-tab ${mode==='test'?'active':''}" data-mode="test">Theo đề kiểm tra 15 phút</button>
    </div>` : `
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="test">Theo đề kiểm tra 15 phút</button>
    </div>
    <p class="mode-note">Chương này chưa có dữ liệu tách theo từng bài học — đang được cập nhật dần.</p>`;

  let rows = units.map((u, ui) => {
    const key = route.si+'-'+mode+'-'+route.ci+'-'+ui;
    const res = resultsStore[key];
    let pillHtml = '';
    if (res) {
      const pct = Math.round(100*res.score/res.total);
      pillHtml = `<span class="score-pill ${pct<50?'low':''}">${res.score}/${res.total} điểm</span>`;
    }
    const subLabel = `${u.questions.length} câu trắc nghiệm`;
    return `
    <div class="test-row ${res?'done':''}" data-ui="${ui}">
      <div class="left">
        <div class="badge">${ui+1}</div>
        <div>
          <div class="label">${u.name}</div>
          <div class="sub">${subLabel}</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        ${pillHtml}
        <span class="go">→</span>
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
    ${header()}
    ${crumbs([{label:'Trang chủ'},{label:chapterShortName(ch)}])}
    <div class="chapter-hero">
      <div class="num">${isFlatChapter(ch) ? 'BÀI ' + extractBaiNum(ch.name) : 'CHƯƠNG ' + chapterNum(route.ci)}</div>
      <h1>${chapterShortName(ch)}</h1>
      <p>Chọn ${mode==='lesson' ? 'một bài học' : 'một đề kiểm tra'} bên dưới để bắt đầu làm bài.</p>
    </div>
    ${modeSwitcher}
    <div class="test-list">${rows}</div>
  `;
  attachHeader();
  app.querySelector('.crumbs').addEventListener('click', e => {
    if (e.target.dataset.idx === '0') { route = {view:'home', si:route.si}; render(); }
  });
  app.querySelectorAll('.mode-tab').forEach(el => {
    el.onclick = () => { route = {view:'chapter', si:route.si, ci:route.ci, mode: el.dataset.mode}; render(); };
  });
  app.querySelectorAll('.test-row').forEach(el => {
    el.onclick = () => {
      const ui = +el.dataset.ui;
      startQuiz(route.ci, mode, ui);
    };
  });
}

// ============ QUIZ ============
function startQuiz(ci, mode, ui) {
  const subj = currentSubject();
  const ch = subj.chapters[ci];
  const qs = unitsFor(ch, mode)[ui].questions;
  quizState = {
    answers: new Array(qs.length).fill(null),
    current: 0
  };
  route = { view: 'quiz', si:route.si, ci, mode, ti: ui };
  render();
}

function renderQuiz() {
  const subj = currentSubject();
  const ch = subj.chapters[route.ci];
  const unit = unitsFor(ch, route.mode)[route.ti];
  const qs = unit.questions;
  const idx = quizState.current;
  const q = qs[idx];
  const answered = quizState.answers[idx];
  const total = qs.length;
  const answeredCount = quizState.answers.filter(a=>a!==null).length;

  const letters = ['A','B','C','D'];
  let optsHtml = q.opts.map((opt, i) => {
    const letter = letters[i];
    let cls = 'opt';
    let disabled = '';
    if (answered !== null) {
      disabled = 'disabled';
      if (letter === q.ans) cls += ' correct';
      else if (letter === answered) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" data-letter="${letter}" ${disabled}>
      <span class="letter">${letter}</span><span>${opt}</span>
    </button>`;
  }).join('');

  let feedback = '';
  if (answered !== null) {
    if (answered === q.ans) {
      feedback = `<div class="feedback ok">✓ Chính xác!</div>`;
    } else {
      feedback = `<div class="feedback bad">✗ Chưa đúng — đáp án đúng là ${q.ans}.</div>`;
    }
  }

  let dots = qs.map((_, i) => {
    let cls = 'dot';
    if (i === idx) cls += ' current';
    const a = quizState.answers[i];
    if (a !== null) {
      cls += ' answered ' + (a === qs[i].ans ? 'correct' : 'wrong');
    }
    return `<div class="${cls}" data-jump="${i}">${i+1}</div>`;
  }).join('');

  const isLast = idx === total - 1;
  const canNext = answered !== null;
  const chLabel = isFlatChapter(ch) ? chapterShortName(ch) : `${chapterShortName(ch)} — ${unit.name}`;

  app.innerHTML = `
    ${header()}
    ${crumbs([{label:'Trang chủ'},{label:chapterShortName(ch)},{label:unit.name}])}
    <div class="quiz-top">
      <h1>${chLabel}</h1>
      <div class="progress-track"><div class="progress-fill" style="width:${100*(answeredCount)/total}%"></div></div>
      <div class="dots">${dots}</div>
    </div>
    <div class="q-card">
      <div class="q-index">CÂU ${idx+1} / ${total}</div>
      <p class="q-text">${q.q}</p>
      <div class="options">${optsHtml}</div>
      ${feedback}
    </div>
    <div class="quiz-nav">
      <button class="btn secondary" id="prev-btn" ${idx===0?'disabled':''}>← Câu trước</button>
      ${isLast
        ? `<button class="btn" id="finish-btn" ${canNext?'':'disabled'}>Xem kết quả</button>`
        : `<button class="btn" id="next-btn" ${canNext?'':'disabled'}>Câu tiếp →</button>`
      }
    </div>
  `;
  attachHeader();
  app.querySelector('.crumbs').addEventListener('click', e => {
    if (e.target.dataset.idx === '0') { route = {view:'home', si:route.si}; render(); }
    if (e.target.dataset.idx === '1') {
      if (isFlatChapter(ch)) { route = {view:'home', si:route.si}; }
      else { route = {view:'chapter', si:route.si, ci:route.ci, mode:route.mode}; }
      render();
    }
  });

  if (answered === null) {
    app.querySelectorAll('.opt').forEach(el => {
      el.onclick = () => {
        quizState.answers[idx] = el.dataset.letter;
        renderQuiz();
      };
    });
  }

  app.querySelectorAll('.dot').forEach(el => {
    el.onclick = () => { quizState.current = +el.dataset.jump; renderQuiz(); };
  });

  const prevBtn = document.getElementById('prev-btn');
  if (prevBtn) prevBtn.onclick = () => { quizState.current--; renderQuiz(); };
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.onclick = () => { quizState.current++; renderQuiz(); };
  const finishBtn = document.getElementById('finish-btn');
  if (finishBtn) finishBtn.onclick = () => finishQuiz();
}

function finishQuiz() {
  const subj = currentSubject();
  const ch = subj.chapters[route.ci];
  const unit = unitsFor(ch, route.mode)[route.ti];
  const qs = unit.questions;
  let score = 0;
  qs.forEach((q,i) => { if (quizState.answers[i] === q.ans) score++; });
  resultsStore[route.si+'-'+route.mode+'-'+route.ci+'-'+route.ti] = { score, total: qs.length, answers: quizState.answers.slice() };
  route = { view:'result', si:route.si, ci:route.ci, mode:route.mode, ti:route.ti };
  render();
}

// ============ RESULT ============
function renderResult() {
  const subj = currentSubject();
  const ch = subj.chapters[route.ci];
  const unit = unitsFor(ch, route.mode)[route.ti];
  const qs = unit.questions;
  const res = resultsStore[route.si+'-'+route.mode+'-'+route.ci+'-'+route.ti];
  const pct = Math.round(100*res.score/res.total);
  let verdict;
  if (pct === 100) verdict = "Xuất sắc! Trọn vẹn " + res.total + " câu.";
  else if (pct >= 80) verdict = "Rất tốt — nắm chắc phần lớn kiến thức bài này.";
  else if (pct >= 50) verdict = "Ổn — xem lại các câu sai bên dưới rồi làm lại nhé.";
  else verdict = "Nên ôn lại bài học rồi quay lại làm đề này lần nữa.";

  const letters = ['A','B','C','D'];
  let review = qs.map((q,i) => {
    const your = res.answers[i];
    if (your === q.ans) return '';
    const yourText = your ? q.opts[letters.indexOf(your)] : '(bỏ trống)';
    const correctText = q.opts[letters.indexOf(q.ans)];
    return `
    <div class="review-item">
      <div class="q-text"><strong>Câu ${i+1}.</strong> ${q.q}</div>
      <div class="row you"><span class="tag">Bạn chọn ${your||''}:</span> ${yourText}</div>
      <div class="row correct"><span class="tag">Đáp án ${q.ans}:</span> ${correctText}</div>
    </div>`;
  }).join('');

  const hasWrong = res.score < res.total;
  const chLabel = isFlatChapter(ch) ? chapterShortName(ch) : `${unit.name}, ${chapterShortName(ch)}`;

  app.innerHTML = `
    ${header()}
    ${crumbs([{label:'Trang chủ'},{label:chapterShortName(ch)},{label:unit.name}])}
    <div class="q-card result-hero">
      <div class="score-big">${res.score}/${res.total}</div>
      <div class="score-of">điểm — ${chLabel}</div>
      <p class="verdict">${verdict}</p>
      <div class="result-actions">
        <button class="btn" id="retry-btn">Làm lại</button>
        <button class="btn secondary" id="back-btn">Về danh sách</button>
      </div>
    </div>
    ${hasWrong ? `<h2 class="review-title" style="margin-top:32px;">Xem lại câu sai</h2><div class="review-list">${review}</div>` : ''}
  `;
  attachHeader();
  app.querySelector('.crumbs').addEventListener('click', e => {
    if (e.target.dataset.idx === '0') { route = {view:'home', si:route.si}; render(); }
    if (e.target.dataset.idx === '1') {
      if (isFlatChapter(ch)) { route = {view:'home', si:route.si}; }
      else { route = {view:'chapter', si:route.si, ci:route.ci, mode:route.mode}; }
      render();
    }
  });
  document.getElementById('retry-btn').onclick = () => startQuiz(route.ci, route.mode, route.ti);
  document.getElementById('back-btn').onclick = () => {
    if (isFlatChapter(ch)) { route = {view:'home', si:route.si}; }
    else { route = {view:'chapter', si:route.si, ci:route.ci, mode:route.mode}; }
    render();
  };
}

render();

</script>
</body>
</html>
