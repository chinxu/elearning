<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Chủ Nhiệm Điện Tử</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .month-btn.active {
            background-color: #3b82f6; /* blue-500 */
            color: white;
            border-color: #3b82f6;
        }
        .month-btn.has-data:not(.active) {
            background-color: #dcfce7; /* green-100 */
            color: #166534; /* green-800 */
            border-color: #22c55e; /* green-500 */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl md:text-2xl font-bold"><i class="fas fa-book-open mr-2"></i>Sổ Chủ Nhiệm Điện Tử</h1>
        <button id="btn-export" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium transition shadow flex items-center hidden">
            <i class="fas fa-file-excel mr-2"></i><span class="hidden md:inline">Lưu Dữ Liệu (Excel)</span>
        </button>
    </header>

    <main class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full">
        
        <!-- Khu vực Kết nối Đám mây -->
        <div class="bg-white rounded-xl shadow-sm p-5 md:p-8 text-center mb-6 border-t-4 border-blue-500">
            <h2 class="text-xl font-bold text-gray-800 mb-2"><i class="fas fa-cloud text-blue-500 mr-2"></i>Đồng bộ Đám mây</h2>
            <p class="text-gray-600 mb-4 text-sm md:text-base">Nhập <b>Mã Lớp Học</b> để đồng bộ dữ liệu giữa các thiết bị (Ví dụ: lop6a1-2026).</p>
            <div class="flex flex-col md:flex-row justify-center items-center gap-3 max-w-md mx-auto">
                <input type="text" id="class-code-input" placeholder="Nhập mã lớp học..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-lg font-semibold uppercase">
                <button id="btn-connect" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition shadow whitespace-nowrap">
                    Kết nối
                </button>
            </div>
            <p id="cloud-status" class="mt-3 text-sm font-medium text-gray-500"></p>
        </div>

        <!-- Khu vực Upload File (Chỉ hiện khi đã kết nối) -->
        <div id="upload-section" class="bg-white rounded-xl shadow-sm p-6 md:p-10 text-center mb-6 hidden border border-dashed border-gray-300">
            <div class="max-w-md mx-auto">
                <i class="fas fa-file-upload text-5xl text-gray-400 mb-4"></i>
                <h2 class="text-lg font-semibold text-gray-800 mb-2">Tải lên danh sách học sinh</h2>
                <p class="text-gray-500 text-sm mb-6">Hỗ trợ file Excel (.xls, .xlsx). Dữ liệu sẽ được tự động lưu lên đám mây.</p>
                <label for="excel-upload" class="cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium py-3 px-6 rounded-lg border border-blue-200 transition inline-block w-full">
                    <i class="fas fa-folder-open mr-2"></i>Chọn file Excel từ máy
                </label>
                <input type="file" id="excel-upload" accept=".xls,.xlsx" class="hidden">
            </div>
        </div>

        <!-- Danh sách học sinh -->
        <div id="table-container" class="bg-white rounded-xl shadow-sm overflow-hidden hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-gray-700">
                            <th class="py-3 px-4 w-12 text-center">STT</th>
                            <th class="py-3 px-4">Họ và Tên</th>
                            <th class="py-3 px-4 hidden md:table-cell">Giới tính</th>
                            <th class="py-3 px-4 text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="student-list" class="text-gray-800">
                        <!-- Render rows here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Chi tiết Học sinh (Tối ưu cho Điện thoại) -->
    <div id="student-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-2 md:p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[95dvh] flex flex-col overflow-hidden">
            
            <!-- Header Modal (Cố định) -->
            <div class="px-4 md:px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 shrink-0">
                <h3 class="text-lg md:text-xl font-bold text-blue-700" id="modal-student-name">Tên Học Sinh</h3>
                <button id="close-modal" class="text-gray-400 hover:text-red-500 transition text-2xl leading-none">&times;</button>
            </div>

            <!-- Body Modal (Cuộn mượt) -->
            <div class="p-0 flex-1 overflow-y-auto touch-pan-y min-h-0 bg-white">
                
                <!-- Tabs -->
                <div class="flex border-b border-gray-200 sticky top-0 bg-white z-10 shadow-sm">
                    <button id="tab-btn-ly-lich" class="flex-1 py-3 text-center font-semibold text-blue-600 border-b-2 border-blue-600 transition" onclick="switchTab('ly-lich')">
                        <i class="fas fa-id-card mr-2"></i>Lý lịch
                    </button>
                    <button id="tab-btn-nhan-xet" class="flex-1 py-3 text-center font-semibold text-gray-500 border-b-2 border-transparent hover:text-blue-500 transition" onclick="switchTab('nhan-xet')">
                        <i class="fas fa-pen-to-square mr-2"></i>Nhận xét
                    </button>
                </div>

                <!-- Tab Content: Lý lịch -->
                <div id="tab-content-ly-lich" class="p-4 md:p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-bold text-gray-700"><i class="fas fa-info-circle mr-2"></i>Thông tin Excel</h4>
                        <button id="btn-toggle-edit" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded transition">
                            <i class="fas fa-lock mr-1"></i>Chỉnh sửa
                        </button>
                    </div>
                    <div id="modal-info-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Dynamic Info Fields -->
                    </div>
                </div>

                <!-- Tab Content: Nhận xét -->
                <div id="tab-content-nhan-xet" class="p-4 md:p-6 hidden flex flex-col h-full">
                    <div class="flex flex-wrap gap-2 mb-4 justify-center" id="month-buttons">
                        <!-- Nút tháng sẽ render bằng JS -->
                    </div>
                    <textarea id="modal-notes" class="w-full flex-1 min-h-[250px] md:min-h-[300px] border border-gray-300 rounded-lg p-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 resize-none shadow-inner leading-relaxed" placeholder="Nhập nhận xét, vi phạm, thành tích cho tháng này..."></textarea>
                </div>

            </div>

            <!-- Footer Modal (Cố định) -->
            <div class="px-4 md:px-6 py-3 border-t border-gray-200 flex justify-end bg-gray-50 shrink-0">
                <button id="btn-save-modal" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition shadow-md w-full md:w-auto">
                    <i class="fas fa-save mr-2"></i>Lưu Thay Đổi
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // CẤU HÌNH FIREBASE CỦA THẦY SƠN
        const firebaseConfig = {
            apiKey: "AIzaSyC622mgjpfPUsJywGP5qmoiekPy49AeFjE",
            authDomain: "sochunhiem-538d3.firebaseapp.com",
            projectId: "sochunhiem-538d3",
            storageBucket: "sochunhiem-538d3.firebasestorage.app",
            messagingSenderId: "675625186333",
            appId: "1:675625186333:web:217a3fd85c3a32fed5c2f4",
            measurementId: "G-4FXP0JTTPZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Biến toàn cục
        let globalData = [];
        let headers = [];
        let currentEditingIndex = -1;
        let isEditingMode = false;
        let currentClassCode = "";
        
        let currentMonth = 9; // Mặc định mở tháng 9
        let tempMonthlyNotes = {}; // Lưu tạm ghi chú 9 tháng khi đang mở form

        const uploadSection = document.getElementById('upload-section');
        const tableContainer = document.getElementById('table-container');
        const cloudStatus = document.getElementById('cloud-status');
        const classCodeInput = document.getElementById('class-code-input');
        const btnConnect = document.getElementById('btn-connect');
        const btnExport = document.getElementById('btn-export');
        const studentModal = document.getElementById('student-modal');

        // Hàm Đăng nhập Ẩn danh & Kết nối Firestore
        btnConnect.addEventListener('click', async () => {
            const code = classCodeInput.value.trim().toUpperCase();
            if(!code || code.length < 5) {
                Swal.fire('Lỗi', 'Vui lòng nhập mã lớp học (ít nhất 5 ký tự)', 'warning');
                return;
            }
            
            btnConnect.disabled = true;
            btnConnect.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang kết nối...';

            try {
                // Đăng nhập ẩn danh
                await signInAnonymously(auth);
                currentClassCode = code;
                
                // Kéo dữ liệu từ Đám mây về
                const docRef = doc(db, "classes", currentClassCode);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const dbData = docSnap.data();
                    globalData = dbData.students || [];
                    headers = dbData.headers || [];
                    renderTable();
                    
                    cloudStatus.innerHTML = `<i class="fas fa-check-circle text-green-500"></i> Đã tải dữ liệu lớp ${currentClassCode} từ Đám mây.`;
                    uploadSection.classList.add('hidden'); // Có dữ liệu rồi thì ẩn nút up file
                } else {
                    globalData = [];
                    headers = [];
                    tableContainer.classList.add('hidden');
                    cloudStatus.innerHTML = `<i class="fas fa-info-circle text-blue-500"></i> Mã mới. Vui lòng tải file Excel lên để tạo cơ sở dữ liệu.`;
                    uploadSection.classList.remove('hidden');
                }
                
                classCodeInput.disabled = true;
                btnConnect.classList.add('hidden');
                btnExport.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                cloudStatus.innerHTML = `<i class="fas fa-exclamation-triangle text-red-500"></i> Lỗi kết nối. Vui lòng thử lại.`;
                Swal.fire('Lỗi kết nối', error.message, 'error');
            } finally {
                btnConnect.disabled = false;
                btnConnect.innerText = 'Kết nối';
            }
        });

        // Hàm Lưu lên Đám mây
        async function saveToCloud() {
            if(!currentClassCode) return;
            try {
                await setDoc(doc(db, "classes", currentClassCode), {
                    headers: headers,
                    students: globalData,
                    lastUpdated: new Date().toISOString()
                });
                
                const Toast = Swal.mixin({
                    toast: true, position: 'bottom-end', showConfirmButton: false, timer: 3000
                });
                Toast.fire({ icon: 'success', title: 'Đã lưu đồng bộ lên đám mây' });
                
            } catch(e) {
                Swal.fire('Lỗi lưu dữ liệu', 'Không thể đồng bộ lên đám mây', 'error');
            }
        }

        // Đọc File Excel tải lên
        document.getElementById('excel-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1, defval: ""});
                if(jsonData.length < 2) {
                    Swal.fire('Lỗi', 'File Excel không có dữ liệu!', 'error');
                    return;
                }

                headers = jsonData[0];
                globalData = [];

                for (let i = 1; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (row.length === 0 || row.every(cell => cell === "")) continue;
                    
                    let student = {};
                    headers.forEach((header, index) => {
                        student[header] = row[index] || "";
                    });
                    // Khởi tạo Object chứa ghi chú 9 tháng (9,10,11,12,1,2,3,4,5)
                    student.monthlyNotes = {}; 
                    globalData.push(student);
                }

                renderTable();
                saveToCloud(); // Up luôn lên cloud lần đầu
                uploadSection.classList.add('hidden'); // Ẩn khung up file đi
                Swal.fire('Thành công', 'Đã tải và lưu danh sách lớp!', 'success');
            };
            reader.readAsArrayBuffer(file);
        });

        // Hiển thị danh sách ra Bảng
        function renderTable() {
            const tbody = document.getElementById('student-list');
            tbody.innerHTML = '';
            
            if(globalData.length === 0) {
                tableContainer.classList.add('hidden');
                return;
            }
            tableContainer.classList.remove('hidden');

            const nameHeader = headers.find(h => h.toLowerCase().includes('tên')) || headers[1];
            const genderHeader = headers.find(h => h.toLowerCase().includes('nữ') || h.toLowerCase().includes('giới tính'));

            globalData.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-100 hover:bg-blue-50 transition cursor-pointer";
                tr.onclick = () => openModal(index);
                
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center font-medium">${index + 1}</td>
                    <td class="py-3 px-4 font-semibold text-blue-700">${student[nameHeader] || 'Không có tên'}</td>
                    <td class="py-3 px-4 hidden md:table-cell">${genderHeader ? student[genderHeader] : ''}</td>
                    <td class="py-3 px-4 text-center">
                        <button class="bg-blue-100 text-blue-600 px-3 py-1 rounded hover:bg-blue-200 transition text-sm">
                            <i class="fas fa-eye"></i> Chi tiết
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Điều khiển Tabs
        window.switchTab = function(tabName) {
            const tabLyLich = document.getElementById('tab-content-ly-lich');
            const tabNhanXet = document.getElementById('tab-content-nhan-xet');
            const btnLyLich = document.getElementById('tab-btn-ly-lich');
            const btnNhanXet = document.getElementById('tab-btn-nhan-xet');

            if(tabName === 'ly-lich') {
                tabLyLich.classList.remove('hidden');
                tabNhanXet.classList.add('hidden');
                btnLyLich.className = "flex-1 py-3 text-center font-semibold text-blue-600 border-b-2 border-blue-600 transition";
                btnNhanXet.className = "flex-1 py-3 text-center font-semibold text-gray-500 border-b-2 border-transparent hover:text-blue-500 transition";
            } else {
                tabLyLich.classList.add('hidden');
                tabNhanXet.classList.remove('hidden');
                btnNhanXet.className = "flex-1 py-3 text-center font-semibold text-blue-600 border-b-2 border-blue-600 transition";
                btnLyLich.className = "flex-1 py-3 text-center font-semibold text-gray-500 border-b-2 border-transparent hover:text-blue-500 transition";
            }
        };

        // Render nút Tháng
        function renderMonthButtons() {
            const container = document.getElementById('month-buttons');
            container.innerHTML = '';
            const months = [9, 10, 11, 12, 1, 2, 3, 4, 5];
            
            months.forEach(m => {
                const btn = document.createElement('button');
                const hasData = tempMonthlyNotes[m] && tempMonthlyNotes[m].trim() !== '';
                
                btn.className = `month-btn border rounded-full px-4 py-1 text-sm font-medium transition focus:outline-none ${hasData ? 'has-data' : 'border-gray-300 text-gray-600 hover:bg-gray-100'}`;
                if(m === currentMonth) btn.classList.add('active');
                
                btn.innerHTML = hasData && m !== currentMonth ? `Tháng ${m} <div class="inline-block w-2 h-2 rounded-full bg-green-500 ml-1"></div>` : `Tháng ${m}`;
                
                btn.onclick = () => {
                    // Lưu nội dung tháng cũ
                    tempMonthlyNotes[currentMonth] = document.getElementById('modal-notes').value;
                    // Chuyển sang tháng mới
                    currentMonth = m;
                    renderMonthButtons(); // Vẽ lại nút (để cập nhật màu)
                    document.getElementById('modal-notes').value = tempMonthlyNotes[currentMonth] || '';
                    document.getElementById('modal-notes').focus();
                };
                container.appendChild(btn);
            });
        }

        // Mở Modal Chi tiết
        function openModal(index) {
            currentEditingIndex = index;
            isEditingMode = false; // Mặc định khóa sửa
            const student = globalData[index];
            const nameHeader = headers.find(h => h.toLowerCase().includes('tên')) || headers[1];
            
            document.getElementById('modal-student-name').innerText = student[nameHeader] || 'Hồ sơ học sinh';
            
            // Xử lý Lý lịch (Grid Input)
            const grid = document.getElementById('modal-info-grid');
            grid.innerHTML = '';
            headers.forEach(header => {
                const div = document.createElement('div');
                div.className = "flex flex-col bg-gray-50 p-2 rounded border border-transparent transition-all";
                
                const label = document.createElement('label');
                label.className = "text-xs font-semibold text-gray-500 uppercase mb-1";
                label.innerText = header;
                
                const input = document.createElement('input');
                input.type = "text";
                input.value = student[header] || '';
                input.dataset.key = header;
                input.className = "student-field bg-transparent border-none focus:outline-none focus:ring-0 text-sm text-gray-800 font-medium w-full p-1 rounded";
                input.readOnly = true; 
                
                div.appendChild(label);
                div.appendChild(input);
                grid.appendChild(div);
            });

            // Nút Khóa/Sửa Lý lịch
            updateEditModeUI();

            // Xử lý Ghi chú Tháng
            // Fix trường hợp dữ liệu cũ lưu dưới dạng chuỗi đơn thuần
            if (typeof student.monthlyNotes === 'string' || !student.monthlyNotes) {
                student.monthlyNotes = { 9: student.monthlyNotes || (student.notes || '') }; 
            }
            
            // Clone dữ liệu ra biến tạm để thao tác
            tempMonthlyNotes = JSON.parse(JSON.stringify(student.monthlyNotes || {}));
            currentMonth = 9; // Luôn ưu tiên mở tháng 9 trước
            
            renderMonthButtons();
            document.getElementById('modal-notes').value = tempMonthlyNotes[currentMonth] || '';

            switchTab('ly-lich'); // Mở tab lý lịch trước
            studentModal.classList.remove('hidden');
        }

        // Xử lý Nút Bật/Tắt Chỉnh Sửa Lý lịch
        const btnToggleEdit = document.getElementById('btn-toggle-edit');
        btnToggleEdit.addEventListener('click', () => {
            isEditingMode = !isEditingMode;
            updateEditModeUI();
        });

        function updateEditModeUI() {
            const inputs = document.querySelectorAll('.student-field');
            if (isEditingMode) {
                btnToggleEdit.innerHTML = '<i class="fas fa-unlock text-blue-600 mr-1"></i>Đang sửa';
                btnToggleEdit.className = "text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded transition border border-blue-300 shadow-inner";
                inputs.forEach(input => {
                    input.readOnly = false;
                    input.classList.remove('bg-transparent');
                    input.classList.add('bg-white', 'border-gray-300', 'ring-1', 'ring-blue-200');
                    input.parentElement.classList.add('border-blue-200');
                });
            } else {
                btnToggleEdit.innerHTML = '<i class="fas fa-lock mr-1"></i>Chỉnh sửa';
                btnToggleEdit.className = "text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded transition";
                inputs.forEach(input => {
                    input.readOnly = true;
                    input.classList.add('bg-transparent');
                    input.classList.remove('bg-white', 'border-gray-300', 'ring-1', 'ring-blue-200');
                    input.parentElement.classList.remove('border-blue-200');
                });
            }
        }

        // Đóng Modal
        document.getElementById('close-modal').addEventListener('click', () => {
            studentModal.classList.add('hidden');
        });

        // Lưu Thông tin Học sinh (Ghi đè vào mảng và Cloud)
        document.getElementById('btn-save-modal').addEventListener('click', () => {
            if (currentEditingIndex === -1) return;

            // 1. Cập nhật thông tin Lý lịch
            const inputs = document.querySelectorAll('.student-field');
            inputs.forEach(input => {
                const key = input.dataset.key;
                globalData[currentEditingIndex][key] = input.value;
            });
            
            // 2. Cập nhật thông tin Nhận xét (Lưu tháng đang gõ dở)
            tempMonthlyNotes[currentMonth] = document.getElementById('modal-notes').value;
            globalData[currentEditingIndex].monthlyNotes = JSON.parse(JSON.stringify(tempMonthlyNotes));

            // Đóng cửa sổ, render lại bảng và lưu Cloud
            studentModal.classList.add('hidden');
            renderTable();
            saveToCloud();
        });

        // Xuất file Excel
        btnExport.addEventListener('click', () => {
            if (globalData.length === 0) return;

            // Tạo dữ liệu mới chứa thông tin excel cũ + 9 cột tháng
            const exportData = globalData.map(student => {
                const row = {};
                // Coppy thuộc tính cũ
                headers.forEach(h => {
                    row[h] = student[h] || "";
                });
                
                // Thêm 9 cột nhận xét
                const notes = student.monthlyNotes || {};
                const months = [9, 10, 11, 12, 1, 2, 3, 4, 5];
                months.forEach(m => {
                    row[`Nhận xét Tháng ${m}`] = notes[m] || "";
                });
                
                return row;
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "DanhSachHocSinh");

            // Tự động điều chỉnh độ rộng cột
            const colWidths = Object.keys(exportData[0]).map(key => ({
                wch: Math.max(key.length, 15) // Độ rộng tối thiểu 15 ký tự
            }));
            worksheet['!cols'] = colWidths;

            // Đặt tên file có chứa Mã lớp và Ngày tải
            const dateStr = new Date().toLocaleDateString('vi-VN').replace(/\//g, '-');
            XLSX.writeFile(workbook, `So_Chu_Nhiem_${currentClassCode}_${dateStr}.xlsx`);
        });

    </script>
</body>
</html>
